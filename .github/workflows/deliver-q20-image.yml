name: Deliver Q20 image to a git branch

# The built firmware only exists as a GitHub Actions artifact on Azure blob
# storage, which the assistant's egress policy blocks. This tiny job (no
# compilation) downloads that artifact inside GitHub's network and pushes the
# .bin to the `q20-delivery` branch, where it can be fetched over git.
#
# Triggered by pushing the `q20-deliver-trigger` branch (workflow_dispatch would
# require this file on the default branch; a push trigger runs the pushed copy).

on:
  push:
    branches:
      - q20-deliver-trigger

permissions:
  contents: write
  actions: read

env:
  SOURCE_RUN_ID: "31044754321"

jobs:
  deliver:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Download the built sysupgrade artifact
        uses: actions/download-artifact@v4
        with:
          name: smartap-jcg-q20-sysupgrade-38dbm-fromsource
          run-id: ${{ env.SOURCE_RUN_ID }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: dl

      - name: Publish the image to the q20-delivery branch
        run: |
          set -e
          BIN="$(ls dl/*sysupgrade.bin | head -1)"
          [ -n "$BIN" ] || { echo "::error::no sysupgrade.bin in artifact"; exit 1; }
          echo "found: $BIN ($(stat -c%s "$BIN") bytes)"
          sha256sum "$BIN"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B q20-delivery
          mkdir -p dist
          cp "$BIN" dist/smartap-jcg-q20-sysupgrade-38dbm.bin
          sha256sum dist/smartap-jcg-q20-sysupgrade-38dbm.bin > dist/SHA256SUMS
          git add -f dist/smartap-jcg-q20-sysupgrade-38dbm.bin dist/SHA256SUMS
          git commit -m "Deliver Q20 from-source sysupgrade image (source run ${SOURCE_RUN_ID})"
          git push -f origin q20-delivery
