name: Build CR6606 FAST (ImageBuilder · system-30dbm-measured-test)

# Xiaomi Mi Router CR6606 — ramips/mt7621, MT7621AT + MT7915 (WiFi6 AX1800), NAND.
# We apply NO kernel/driver/source patches (DSA is native, power is UCI-only), so the
# official OpenWrt ImageBuilder produces a functionally IDENTICAL image to the source
# build in ~10 min instead of ~50. Bakes the same Smart AP overlay + variant uci-defaults
# (all audit fixes + modal fix) + the same package set. SYSUPGRADE only.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cr6606-fast-build
  cancel-in-progress: true

env:
  VARIANT: system-30dbm-measured-test
  TAG: cr6606-30dbm-measured

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo (overlay)
        uses: actions/checkout@v4

      - name: Install ImageBuilder host deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev zlib1g-dev gawk \
            git gettext libssl-dev xsltproc rsync wget unzip python3 file zstd

      - name: Download OpenWrt ImageBuilder (ramips/mt7621, 24.10.0)
        run: |
          set -eux
          VER=24.10.0
          IB="openwrt-imagebuilder-${VER}-ramips-mt7621.Linux-x86_64"
          URL="https://downloads.openwrt.org/releases/${VER}/targets/ramips/mt7621/${IB}.tar.zst"
          wget -q "$URL" -O ib.tar.zst
          tar --zstd -xf ib.tar.zst
          mv "$IB" ib

      - name: Merge overlay (shared base + variant)
        run: |
          set -eux
          MERGED="$GITHUB_WORKSPACE/merged"; rm -rf "$MERGED"; mkdir -p "$MERGED"
          cp -a "$GITHUB_WORKSPACE/openwrt-cr6606/files/." "$MERGED/"
          cp -a "$GITHUB_WORKSPACE/openwrt-cr6606/variants/${VARIANT}/." "$MERGED/"
          echo "=== merged overlay ==="; find "$MERGED" -type f | sort | head -80
          echo "=== uci-defaults ==="; ls -la "$MERGED/etc/uci-defaults/"

      - name: Build CR6606 image (Smart AP + all packages)
        run: |
          set -eux
          cd ib
          make info 2>/dev/null | grep -i "cr6606" || { echo "FATAL: cr6606 profile not found"; exit 1; }
          make image \
            PROFILE="xiaomi_mi-router-cr6606" \
            PACKAGES="luci luci-ssl luci-i18n-base-ar curl wpad-openssl -wpad-basic-mbedtls kmod-mt7915e kmod-mt7915-firmware iw iwinfo kmod-nft-offload ip-full ip-bridge arping" \
            FILES="$GITHUB_WORKSPACE/merged" \
            EXTRA_IMAGE_NAME="${VARIANT}"
          echo "=== built images ==="
          ls -la bin/targets/ramips/mt7621/ | grep -i cr6606 || ls -la bin/targets/ramips/mt7621/

      - name: Collect SYSUPGRADE only + checksum
        run: |
          set -eux
          OUT="$GITHUB_WORKSPACE/out"; mkdir -p "$OUT"
          SRC="$(ls ib/bin/targets/ramips/mt7621/*cr6606*sysupgrade.bin | head -1)"
          test -s "$SRC" || { echo "NO SYSUPGRADE IMAGE"; exit 1; }
          cp "$SRC" "$OUT/cr6606-${VARIANT}-sysupgrade.bin"
          cd "$OUT"; ls -la
          sha256sum *.bin > "sha256-${VARIANT}.txt"; cat "sha256-${VARIANT}.txt"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: "cr6606-${{ env.VARIANT }}-fast", path: out/*, if-no-files-found: warn }

      - name: Publish to Release (sysupgrade only)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "CR6606 system-30dbm-measured-test — FAST (ImageBuilder, all-channels proof)"
          body: |
            Xiaomi CR6606 (ramips/mt7621, MT7915 WiFi6 AX1800 2x2/2x2). DSA native.
            OpenWrt 24.10.0 ImageBuilder (functionally identical to the source build — we
            apply no kernel/driver patches). Smart AP UI + LuCI + SSH + flow offload (SW)
            + the in-system proof scripts + all audit fixes + modal dark-fix.
            txpower=30 request on 2.4G+5G; NO regdb/caldata patch, NO MAC change.
            Flash: sysupgrade -n /tmp/cr6606.bin
          files: |
            out/cr6606-system-30dbm-measured-test-sysupgrade.bin
            out/sha256-system-30dbm-measured-test.txt
          fail_on_unmatched_files: false
