name: Build SmartAP Q20 (from source — kernel-level fixes + 38 dBm driver)

# Builds a FROM-SOURCE OpenWrt image for the JCG Q20 on GitHub's Ubuntu runners
# (open internet + toolchain, which this repo's sandbox does not have). It recompiles
# the whole image and enforces the SmartAP customisation from source.
#
# DEFAULT build (guaranteed bootable):
#   * mt7915 EEPROM target power -> 38.0 dBm, patched in the driver SOURCE (a proof
#     marker is grep-gated, so the artifact CANNOT ship un-patched).
#   * the exact SmartAP overlay (router/jcg-q20/files): dashboard, DSA, 2xLAN+WAN, LEDs,
#     regdb 38, bootstrap theme, login redirect.
#   * stock kernel + device tree — nothing risky is touched, so a flashed unit always boots.
#
# OPTIONAL (apply_nand_ecc = true): also set the NAND to 8-bit/512 ECC in the device
#   tree (OpenWrt #20878 — the "random hang / reset after a while" root cause). This is a
#   real kernel-level fix but it cannot be proven safe without flashing real hardware
#   (if the controller rejected strength 8 the NAND would not attach), so it is OFF by
#   default. Turn it on to test on a unit you can recover over the LAN cable.
#
# NOT applicable to this hardware (documented honestly, so nobody hunts for a phantom fix):
#   * WAN gmac1 fixed-link (#16083) — the Q20 WAN uses a REAL gigabit PHY
#     (phy-handle = <&ethphy0>); it already negotiates 1000, there is no fixed-link to add.
#   * WED / hardware flow offload (#868) — an MT7622/MT7986/MT7981 feature; the Q20's
#     MT7621 has no WED block, so there is nothing to enable.
#
# Run: Actions -> this workflow -> "Run workflow" -> pick the OpenWrt ref. ~1-2 h.

on:
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: 'OpenWrt git ref to build (branch or tag that has jcg_q20 on kernel 6.12)'
        required: true
        default: 'v25.12.5'
      apply_nand_ecc:
        description: 'Also apply the experimental NAND 8-bit/512 ECC DT fix (#20878). OFF = guaranteed-bootable.'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout this repo (SmartAP overlay + patch scripts)
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "== before =="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "== after =="; df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget quilt \
            libelf-dev ecj fastjar java-propose-classpath squashfs-tools

      - name: Clone OpenWrt
        env:
          # Pass the free-form dispatch input through the environment so the runner sets it
          # verbatim — never interpolated into the shell text (avoids ${{ }} command injection).
          OPENWRT_REF: ${{ github.event.inputs.openwrt_ref }}
        run: |
          retry(){ n=0; until "$@"; do n=$((n+1)); [ $n -ge 5 ] && return 1; echo "retry $n/5: $*"; sleep $((n*10)); done; }
          retry git clone https://git.openwrt.org/openwrt/openwrt.git ow
          cd ow
          git checkout "$OPENWRT_REF"
          git log -1 --oneline

      - name: Update & install feeds
        run: |
          cd ow
          retry(){ n=0; until "$@"; do n=$((n+1)); [ $n -ge 5 ] && return 1; echo "retry $n/5: $*"; sleep $((n*10)); done; }
          # Feed clones are network-dependent. A transient failure previously left
          # feeds/luci and feeds/routing missing, which silently broke defconfig and the
          # device-target assertion. Retry the update, then PROVE the core feeds actually
          # landed before installing — a partial fetch now fails loudly right here.
          retry ./scripts/feeds update -a
          for f in luci routing packages; do
            [ -d "feeds/$f" ] || { echo "feed $f missing after update — retrying"; retry ./scripts/feeds update -a; break; }
          done
          [ -d feeds/luci ] && [ -d feeds/routing ] && [ -d feeds/packages ] \
            || { echo "::error::core feeds (luci/routing/packages) still missing after retries"; exit 1; }
          retry ./scripts/feeds install -a

      - name: Kernel warm-reboot fix — longer PCIe reset delays (openwrt#17895 / mt76#644)
        run: |
          # mt7915e can fail to init ("Message timeout" / dead Wi-Fi) after a WARM
          # reboot: the stock pcie-mt7621 PERST/init delays (100 ms) are too short for
          # the chip's reset. Community-verified fix is 100 -> 500 ms. Pure timing
          # change (~1.2 s slower boot), no functional code touched. Quilt applies it
          # during kernel prepare; a context mismatch fails the build loudly rather
          # than shipping unpatched.
          install -m 0644 \
            "$GITHUB_WORKSPACE/router/jcg-q20/kernel-build/patches/399-pcie-mt7621-longer-reset-delays.patch" \
            ow/target/linux/ramips/patches-6.12/399-pcie-mt7621-longer-reset-delays.patch
          ls -l ow/target/linux/ramips/patches-6.12/ | grep 399-pcie

      - name: Confirm the Q20 device profile exists at this ref
        run: |
          cd ow
          grep -rq "jcg,q20" target/linux/ramips/ \
            && echo "jcg,q20 present" \
            || { echo "::error::jcg_q20 not in this OpenWrt ref — pick a newer ref"; exit 1; }
          ls target/linux/ramips/dts/mt7621_jcg_q20.dts

      - name: (Optional) NAND 8-bit/512 ECC device-tree fix — only if apply_nand_ecc=true
        run: |
          cd ow
          DTS=target/linux/ramips/dts/mt7621_jcg_q20.dts
          if [ "${{ github.event.inputs.apply_nand_ecc }}" = "true" ]; then
            cp "$DTS" "$DTS.orig"
            python3 "$GITHUB_WORKSPACE/router/jcg-q20/kernel-build/patch-dts.py" "$DTS"
            echo "=== DTS DIFF ==="
            diff -u "$DTS.orig" "$DTS" || true
            rm -f "$DTS.orig"
          else
            echo "apply_nand_ecc=false -> keeping stock kernel ECC (guaranteed-bootable build)"
          fi

      - name: Bake in the SmartAP Q20 overlay
        run: |
          cd ow
          mkdir -p files
          cp -a "$GITHUB_WORKSPACE/router/jcg-q20/files/." files/
          # The overlay's binary-patched mt7915e.ko belongs ONLY to the no-toolchain
          # overlay build. Here the driver is compiled from patched SOURCE — the stale
          # .ko must not override it (it lacks the proof marker and would fail the gate).
          rm -rf files/lib/modules
          # bootstrap-dark/light must remain symlinks -> bootstrap
          for t in bootstrap-dark bootstrap-light; do
            d="files/usr/share/ucode/luci/template/themes/$t"
            [ -L "$d" ] || { rm -rf "$d"; ln -s bootstrap "$d"; }
          done
          chmod 0755 files/usr/sbin/* files/usr/bin/* files/etc/init.d/* files/www/cgi-bin/* 2>/dev/null || true
          echo "overlay files: $(find files -type f | wc -l)"

      - name: Seed .config and expand
        run: |
          cd ow
          cp "$GITHUB_WORKSPACE/router/jcg-q20/kernel-build/jcg-q20.seed.config" .config
          make defconfig
          grep -q 'CONFIG_TARGET_ramips_mt7621_DEVICE_jcg_q20=y' .config \
            && echo "device profile selected" \
            || { echo "::error::jcg_q20 profile NOT selected"; exit 1; }
          # `make defconfig` SILENTLY drops any CONFIG_PACKAGE_* symbol it can't resolve
          # (renamed/removed package), so a curated feature could vanish with no error.
          # Assert every explicitly-requested =y package survived the expansion.
          missing=""
          while IFS= read -r sym; do
            grep -qxF "$sym" .config || missing="$missing ${sym%=y}"
          done < <(grep -E '^CONFIG_PACKAGE_[A-Za-z0-9._-]+=y' \
                     "$GITHUB_WORKSPACE/router/jcg-q20/kernel-build/jcg-q20.seed.config")
          # NOTE: warn, do not fail. Virtual/PROVIDES packages (e.g. nftables -> nftables-json)
          # and dependency-pulled apps legitimately do not appear as a literal =y line even
          # though they end up in the image, so a hard failure here false-positives. The
          # warning still surfaces anything genuinely renamed for review in the build log.
          if [ -n "$missing" ]; then
            echo "::warning::packages not present as a literal =y after defconfig (may be virtual/dependency-provided, review):$missing"
          else
            echo "all curated packages survived defconfig"
          fi

      - name: Download sources
        run: cd ow && make download -j8 V=s

      - name: Driver 38 dBm — persist mt76 source patch, prove before/after
        run: |
          cd ow
          make package/kernel/mt76/prepare V=s QUILT=1 2>&1 | tail -3 || \
            make package/kernel/mt76/prepare V=s 2>&1 | tail -3 || true
          MT76DIR="$(find build_dir -maxdepth 5 -type d -name 'mt76-*' 2>/dev/null | head -1)"
          echo "MT76DIR=${MT76DIR:-NONE}"
          [ -n "$MT76DIR" ] || { echo "::error::no mt76 build dir"; exit 1; }
          cp "$MT76DIR/mt7915/eeprom.c" "$MT76DIR/mt7915/eeprom.c.orig"
          python3 "$GITHUB_WORKSPACE/router/jcg-q20/kernel-build/apply-mt76-38.py" "$MT76DIR"
          echo "=== eeprom.c DIFF ==="
          diff -u "$MT76DIR/mt7915/eeprom.c.orig" "$MT76DIR/mt7915/eeprom.c" || true
          # Persist the edit as a REAL OpenWrt package patch so it is re-applied on EVERY
          # (re)prepare of mt76. Enabling extra kmods (wireguard/cake/nft…) reconfigures the
          # kernel, which forces out-of-tree modules like mt76 to re-prepare from pristine
          # source during the full `make` — that silently wipes an in-place build_dir edit
          # (the run #3 failure: marker absent from the shipped mt7915e.ko). A patch in
          # package/kernel/mt76/patches/ survives any number of re-prepares.
          mkdir -p package/kernel/mt76/patches
          diff -u -L a/mt7915/eeprom.c -L b/mt7915/eeprom.c \
            "$MT76DIR/mt7915/eeprom.c.orig" "$MT76DIR/mt7915/eeprom.c" \
            > package/kernel/mt76/patches/999-smartap-q20-38dbm.patch || true
          rm -f "$MT76DIR/mt7915/eeprom.c.orig"
          echo "=== persisted package patch (package/kernel/mt76/patches/999-smartap-q20-38dbm.patch) ==="
          cat package/kernel/mt76/patches/999-smartap-q20-38dbm.patch
          test -s package/kernel/mt76/patches/999-smartap-q20-38dbm.patch \
            || { echo "::error::38 dBm patch is empty — refusing"; exit 1; }
          # Clean so the full build re-extracts pristine mt76 and applies ALL patches,
          # ours included — guaranteeing the marker lands in the compiled mt7915e.ko.
          make package/kernel/mt76/clean V=s 2>&1 | tail -2 || true

      - name: Build firmware
        run: |
          cd ow
          make -j$(nproc) || make -j1 V=s

      - name: Prove the compiled driver carries the 38 dBm marker
        run: |
          cd ow
          BIN="$(ls bin/targets/ramips/mt7621/*sysupgrade.bin | head -1)"
          echo "image: $BIN"; sha256sum "$BIN"
          rm -rf /tmp/imgchk && mkdir -p /tmp/imgchk
          tar -xf "$BIN" -C /tmp/imgchk 2>/dev/null || true
          ROOT="$(find /tmp/imgchk -name root -type f | head -1)"
          unsquashfs -q -d /tmp/imgchk/sq "$ROOT" >/dev/null 2>&1 || true
          KO="$(find /tmp/imgchk/sq -name 'mt7915e.ko' | head -1)"
          echo "in-image mt7915e.ko: ${KO:-NONE}"
          if [ -n "$KO" ] && strings -a "$KO" | grep -q "SMARTAP-Q20-RF-38DBM-LINEAR"; then
            echo "::notice::CONFIRMED — 38 dBm marker is inside the FINAL image driver"
          else
            echo "::error::38 dBm marker NOT in the final image driver — refusing"; exit 1
          fi

      - name: Upload sysupgrade image
        uses: actions/upload-artifact@v4
        with:
          name: smartap-jcg-q20-sysupgrade-38dbm-fromsource
          path: ow/bin/targets/ramips/mt7621/*sysupgrade.bin
          if-no-files-found: error
          retention-days: 14
