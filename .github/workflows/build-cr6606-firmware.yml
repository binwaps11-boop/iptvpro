name: Build CR6606 Custom Firmware

# Builds a REAL flashable image for Xiaomi Mi Router CR6606 ONLY, using the
# official OpenWrt ImageBuilder (runs on GitHub runners, which have full network
# access to downloads.openwrt.org). Produces:
#   - openwrt-cr6606-custom-sysupgrade.bin
#   - .sha256, .manifest, packages.list, build.log
# as downloadable artifacts. No fake binaries, no other device.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "OpenWrt stable version (ImageBuilder)"
        required: true
        default: "24.10.0"
  push:
    paths:
      - "firmware/cr6606/**"
      - ".github/workflows/build-cr6606-firmware.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install host deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses5-dev zlib1g-dev \
            gawk git gettext libssl-dev xsltproc rsync wget unzip python3 \
            zstd file

      - name: Resolve settings
        id: cfg
        run: |
          set -e
          VER="${{ github.event.inputs.version }}"
          [ -z "$VER" ] && VER="24.10.0"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "target=ramips"   >> "$GITHUB_OUTPUT"
          echo "subtarget=mt7621" >> "$GITHUB_OUTPUT"
          echo "profile=xiaomi_mi-router-cr6606" >> "$GITHUB_OUTPUT"

      - name: Download official ImageBuilder (CR6606 target = ramips/mt7621)
        run: |
          set -e
          VER="${{ steps.cfg.outputs.version }}"
          BASE="https://downloads.openwrt.org/releases/${VER}/targets/ramips/mt7621"
          STEM="openwrt-imagebuilder-${VER}-ramips-mt7621.Linux-x86_64"
          # 24.10+ uses .tar.zst; older uses .tar.xz. Try zst then xz.
          if wget -q "${BASE}/${STEM}.tar.zst"; then
            tar --use-compress-program=unzstd -xf "${STEM}.tar.zst"
          else
            wget -q "${BASE}/${STEM}.tar.xz"
            tar -xJf "${STEM}.tar.xz"
          fi
          echo "IB_DIR=${STEM}" >> "$GITHUB_ENV"
          ls -la "${STEM}"

      - name: Verify CR6606 profile exists in this ImageBuilder (safety gate)
        working-directory: ${{ env.IB_DIR }}
        run: |
          set -e
          if ! make info 2>/dev/null | grep -q "xiaomi_mi-router-cr6606"; then
            echo "::error::Profile xiaomi_mi-router-cr6606 NOT found in ImageBuilder. Aborting."
            make info | grep -i xiaomi || true
            exit 1
          fi
          echo "OK: xiaomi_mi-router-cr6606 profile present."

      - name: Build image
        working-directory: ${{ env.IB_DIR }}
        run: |
          set -e
          # Build space-separated package list from packages.txt (strip comments).
          PKGS="$(grep -vE '^\s*#' ../firmware/cr6606/build/packages.txt | tr '\n' ' ')"
          echo "Packages: $PKGS"
          make image \
            PROFILE="xiaomi_mi-router-cr6606" \
            PACKAGES="$PKGS" \
            FILES="../firmware/cr6606/files" \
            2>&1 | tee ../build.log

      - name: Collect, rename, checksum, manifest
        run: |
          set -e
          OUT="bin/targets/ramips/mt7621"
          SRC="$(ls ${IB_DIR}/${OUT}/openwrt-*-xiaomi_mi-router-cr6606-squashfs-sysupgrade.bin)"
          echo "Built: $SRC"
          mkdir -p dist
          cp "$SRC" dist/openwrt-cr6606-custom-sysupgrade.bin
          cp ${IB_DIR}/${OUT}/openwrt-*-xiaomi_mi-router-cr6606.manifest dist/manifest.txt
          cp build.log dist/build.log
          # Real package list = the manifest (name + exact version actually included)
          cp dist/manifest.txt dist/packages.list
          cd dist
          sha256sum openwrt-cr6606-custom-sysupgrade.bin > openwrt-cr6606-custom-sysupgrade.bin.sha256
          echo "===== SHA256 ====="; cat openwrt-cr6606-custom-sysupgrade.bin.sha256
          echo "===== FILE TYPE ====="; file openwrt-cr6606-custom-sysupgrade.bin
          ls -la

      - name: Upload firmware artifacts (workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: cr6606-custom-firmware
          path: dist/
          if-no-files-found: error
          retention-days: 30

      # Permanent home on GitHub: publish/refresh a Release with everything.
      - name: Publish GitHub Release (permanent download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cr6606-${{ steps.cfg.outputs.version }}
          name: CR6606 Custom Firmware (OpenWrt ${{ steps.cfg.outputs.version }})
          body: |
            Custom OpenWrt firmware for **Xiaomi Mi Router CR6606 ONLY**
            (profile `xiaomi_mi-router-cr6606`, target ramips/mt7621).

            Files:
            - `openwrt-cr6606-custom-sysupgrade.bin` — flashable image
            - `openwrt-cr6606-custom-sysupgrade.bin.sha256` — checksum
            - `manifest.txt` / `packages.list` — exact packages with versions
            - `build.log` — full ImageBuilder log

            Flash: `sysupgrade -v -n openwrt-cr6606-custom-sysupgrade.bin`
            Verify on device: `sh /root/verify-all.sh` and friends.
          files: dist/*
          fail_on_unmatched_files: true
          make_latest: "true"
