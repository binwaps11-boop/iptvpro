name: Build Card Manager APK

on:
  push:
    branches:
      - claude/user-card-management-app-6nhwlj
      - main
    paths:
      - "CardManagerApp/**"
      - ".github/workflows/build-card-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: CardManagerApp
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp CardManagerApp/app/build/outputs/apk/debug/app-debug.apk CardManager.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CardManager-APK
          path: CardManager.apk

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: card-manager-latest
          name: "Card Manager APK (آخر إصدار)"
          body: "أحدث نسخة من تطبيق مدير الكروت — حمّل CardManager.apk وثبّته على جوالك."
          prerelease: true
          files: CardManager.apk
