name: Build Card Manager APK

on:
  push:
    branches:
      - claude/user-card-management-app-6nhwlj
      - main
    paths:
      - "CardManagerApp/**"
      - ".github/workflows/build-card-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Check 50k generation, page planning and PDF recovery
        working-directory: CardManagerApp
        run: bash tools/performance/run-checks.sh

      - name: Save measured core performance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CardManager-performance
          path: CardManagerApp/build/performance/*.json
          if-no-files-found: ignore

      # اختبارات المنطق الحرج تسبق البناء: أي رجوع لعطل معروف يوقف الإصدار
      - name: Run unit tests
        working-directory: CardManagerApp
        run: gradle testSubscriberDebugUnitTest --no-daemon --stacktrace

      - name: Build both APKs
        working-directory: CardManagerApp
        run: gradle assembleSubscriberDebug assembleAdminDebug --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          cp CardManagerApp/app/build/outputs/apk/subscriber/debug/app-subscriber-debug.apk CardManager.apk
          cp CardManagerApp/app/build/outputs/apk/admin/debug/app-admin-debug.apk CardManager-Admin.apk
          ls -la *.apk

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open both apps on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7_pro
          disk-size: 2048M
          disable-animations: true
          script: python3 CardManagerApp/tools/android/smoke.py

      - name: Save Android startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CardManager-startup
          path: CardManagerApp/build/startup/
          if-no-files-found: ignore

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CardManager-APKs
          path: |
            CardManager.apk
            CardManager-Admin.apk

      - name: Publish rolling release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: card-manager-latest
          name: "Card Manager APK (آخر إصدار)"
          body: |
            ## تطبيقان

            - **CardManager.apk** — مدير الكروت 4: استوديو دفعات، متابعة سرعات المراحل، توليد يمنع تكرار الكروت المحفوظة.
            - **CardManager-Admin.apk** — لوحة إدارة التراخيص لصاحب النظام.

            إعداد التشغيل المحلي الحالي لا يفرض بوابة تفعيل. يُنشر هذا الإصدار بعد نجاح اختبارات الوحدات وبناء التطبيقين.

            قياس التوليد الموجود مع ملفات هذه العملية يختبر الرموز وتخطيط الصفحات فقط؛ سرعة PDF والراوتر والطابعة تعتمد على الجهاز والشبكة والقالب.
          prerelease: true
          files: |
            CardManager.apk
            CardManager-Admin.apk
