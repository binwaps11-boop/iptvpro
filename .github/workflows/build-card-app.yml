name: Build Card Manager APK

on:
  push:
    branches:
      - claude/user-card-management-app-6nhwlj
      - main
    paths:
      - "CardManagerApp/**"
      - "license-server/**"
      - ".github/workflows/build-card-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"
          cache-read-only: false

      - name: Check 50k generation, page planning and PDF recovery
        working-directory: CardManagerApp
        run: bash tools/performance/run-checks.sh

      - name: Save measured core performance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CardManager-performance
          path: CardManagerApp/build/performance/*.json
          if-no-files-found: ignore

      # اختبارات المنطق الحرج تسبق البناء: أي رجوع لعطل معروف يوقف الإصدار
      - name: Test signed subscription API
        run: node license-server/test.js

      - name: Run unit tests
        working-directory: CardManagerApp
        run: gradle testSubscriberDebugUnitTest --no-daemon --stacktrace

      - name: Build both APKs
        id: apks
        working-directory: CardManagerApp
        run: gradle assembleSubscriberRelease assembleAdminRelease --no-daemon --stacktrace

      - name: Collect unsigned release APKs and sign temporary emulator copies
        run: |
          cp CardManagerApp/app/build/outputs/apk/subscriber/release/app-subscriber-release-unsigned.apk CardManager-unsigned.apk
          cp CardManagerApp/app/build/outputs/apk/admin/release/app-admin-release-unsigned.apk CardManager-Admin-unsigned.apk
          sdk_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          cp "$sdk_tools/lib/apksigner.jar" apksigner.jar
          test_pass="$(openssl rand -hex 32)"
          echo "::add-mask::$test_pass"
          export CARDMANAGER_TEST_PASS="$test_pass"
          keytool -genkeypair -keystore "$RUNNER_TEMP/test-signing.p12" -storetype PKCS12 -alias test -keyalg RSA -keysize 2048 -validity 2 -dname 'CN=Ephemeral CI Test' -storepass:env CARDMANAGER_TEST_PASS
          java -jar apksigner.jar sign --ks "$RUNNER_TEMP/test-signing.p12" --ks-pass env:CARDMANAGER_TEST_PASS --ks-key-alias test --out CardManager.apk CardManager-unsigned.apk
          java -jar apksigner.jar sign --ks "$RUNNER_TEMP/test-signing.p12" --ks-pass env:CARDMANAGER_TEST_PASS --ks-key-alias test --out CardManager-Admin.apk CardManager-Admin-unsigned.apk
          rm "$RUNNER_TEMP/test-signing.p12"

      # No production private key is sent to CI or committed to the repository.
      - name: Save unsigned APK candidates for verification
        uses: actions/upload-artifact@v4
        with:
          name: CardManager-unsigned-release
          path: |
            CardManager-unsigned.apk
            CardManager-Admin-unsigned.apk
            apksigner.jar
            CardManagerApp/app/build/outputs/mapping/*Release/mapping.txt

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Open both apps on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          profile: pixel_7_pro
          disk-size: 2048M
          disable-animations: true
          script: python3 CardManagerApp/tools/android/smoke.py

      - name: Open both apps on Android 8
        if: ${{ !cancelled() && steps.apks.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 2048M
          disable-animations: true
          script: python3 CardManagerApp/tools/android/smoke.py

      - name: Save Android startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CardManager-startup
          path: |
            CardManagerApp/build/startup/
            CardManagerApp/app/build/outputs/mapping/*Release/mapping.txt
          if-no-files-found: ignore
