name: Build CR6608 v92 (38 dBm from source, real mt76 driver)

# Builds a from-source OpenWrt 24.10.6 image for the Xiaomi CR6608 on GitHub's
# Ubuntu runners (they have the open internet + toolchain this needs). Bakes in
# the full v92 Smart AP overlay (71 cards, argon Obsidian, 1-38 dBm Req/Applied) and the mt76 SKU->38 dBm driver patch (999-mt7915-cr6608-rf-38dbm.patch / apply-mt76-38.py, cr6608_rf_38dbm param), then
# uploads the flashable sysupgrade .bin as a downloadable artifact.
#
# Run it: GitHub -> Actions -> "Build CR6608 v92 (38 dBm from source, real mt76 driver)" ->
# "Run workflow" (pick this branch). ~1-2 hours. Download the artifact when done.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/smart-dashboard-login-build-ice1r6
    paths:
      - 'router/cr6608/ubuntu-build/**'
      - '.github/workflows/build-cr6608-v86.yml'

permissions:
  contents: write

concurrency:
  group: cr6608-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "== before =="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "== after =="; df -h /

      - name: Install build dependencies
        run: |
          # GitHub runners sometimes ship a broken packages.microsoft.com / azure-cli
          # apt source (invalid InRelease signature) that makes `apt-get update` exit 100.
          # Those third-party repos are irrelevant to this build, so drop them first.
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list \
                     /etc/apt/sources.list.d/azure-cli.list \
                     /etc/apt/sources.list.d/*microsoft* 2>/dev/null || true
          sudo apt-get update || sudo apt-get update -o Acquire::AllowInsecureRepositories=true || true
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget quilt \
            libelf-dev ecj fastjar java-propose-classpath

      - name: Clone OpenWrt 24.10.6
        run: |
          git clone https://git.openwrt.org/openwrt/openwrt.git ow
          cd ow
          git checkout v24.10.6
          git log -1 --oneline

      - name: Update & install feeds
        run: |
          cd ow
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Bake in the v92 overlay
        run: |
          cd ow
          mkdir -p files
          cp -a "$GITHUB_WORKSPACE/router/cr6608/ubuntu-build/files/." files/
          chmod 0755 files/usr/sbin/* 2>/dev/null || true
          # ensure a regulatory.db exists (ours is patched: 36 dBm, no DFS)
          test -s files/lib/firmware/regulatory.db && echo "regdb present" || true
          find files -type f | wc -l

      - name: Seed .config and expand
        run: |
          cd ow
          cp "$GITHUB_WORKSPACE/router/cr6608/ubuntu-build/cr6608.seed.config" .config
          make defconfig
          grep -q 'CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-cr6608=y' .config \
            && echo "device profile selected" \
            || { echo "device profile NOT selected"; exit 1; }

      - name: Download sources
        run: cd ow && make download -j8 V=s

      - name: Install CR6608 38 dBm mt76 patch into the package patch pipeline
        run: |
          cd ow
          # 1) prepare ONCE to get pristine mt76 source we can diff against.
          make package/kernel/mt76/prepare V=s QUILT=1 2>&1 | tail -3 || \
            make package/kernel/mt76/prepare V=s 2>&1 | tail -3 || true
          MT76DIR="$(find build_dir -maxdepth 5 -type d -name 'mt76-*' 2>/dev/null | head -1)"
          echo "===MT76DIR=== ${MT76DIR:-NONE}"
          [ -n "$MT76DIR" ] || { echo "no mt76 dir"; exit 1; }
          export MT76DIR
          cp "$MT76DIR/mt7915/mcu.c"    /tmp/mcu.c.orig
          cp "$MT76DIR/mt7915/init.c"   /tmp/init.c.orig
          cp "$MT76DIR/mt7915/eeprom.c" /tmp/eeprom.c.orig
          echo "===BEFORE: power-related lines in mt7915==="
          grep -RIn "CR6608-RF\|38DBM\|la.cck\|la.ofdm\|la.mcs\|la.ru\|max_power\|max_reg_power\|orig_mpwr\|sku_path_en\|return target_power" "$MT76DIR/mt7915/mcu.c" "$MT76DIR/mt7915/init.c" "$MT76DIR/mt7915/eeprom.c" | head -50
          python3 "$GITHUB_WORKSPACE/router/cr6608/ubuntu-build/apply-mt76-38.py"
          echo "===AFTER: 76/72/68 + banner + eeprom target floor in mt7915==="
          grep -RIn "CR6608-RF-38DBM-LINEAR\|= 76\|= 72\|= 68\|max_power < 38\|max_reg_power < 38\|target_power = 76" "$MT76DIR/mt7915/mcu.c" "$MT76DIR/mt7915/init.c" "$MT76DIR/mt7915/eeprom.c" | head -50
          # 2) Turn the applied edit into a REAL OpenWrt package patch (a/ b/ = source
          #    root relative). Placed in package/kernel/mt76/patches/, OpenWrt re-applies
          #    it automatically on EVERY extraction -> survives any re-prepare. This is the
          #    fix for the earlier bug where the full build re-extracted a pristine tree and
          #    discarded a build_dir edit, so the compiled .ko had none of our changes.
          mkdir -p package/kernel/mt76/patches
          {
            diff -u --label a/mt7915/mcu.c    --label b/mt7915/mcu.c    /tmp/mcu.c.orig    "$MT76DIR/mt7915/mcu.c"    || true
            diff -u --label a/mt7915/init.c   --label b/mt7915/init.c   /tmp/init.c.orig   "$MT76DIR/mt7915/init.c"   || true
            diff -u --label a/mt7915/eeprom.c --label b/mt7915/eeprom.c /tmp/eeprom.c.orig "$MT76DIR/mt7915/eeprom.c" || true
          } > package/kernel/mt76/patches/999-cr6608-38dbm.patch
          echo "===GENERATED PATCH (package/kernel/mt76/patches/999-cr6608-38dbm.patch)==="
          cat package/kernel/mt76/patches/999-cr6608-38dbm.patch
          test -s package/kernel/mt76/patches/999-cr6608-38dbm.patch || { echo "::error::generated patch is empty"; exit 1; }
          # 3) clean the extracted tree, then re-prepare so the patch is applied THROUGH the
          #    pipeline (proving it applies cleanly the same way the full build will).
          make package/kernel/mt76/clean V=s 2>&1 | tail -3 || true
          make package/kernel/mt76/prepare V=s 2>&1 | tail -6
          MT76DIR2="$(find build_dir -maxdepth 5 -type d -name 'mt76-*' 2>/dev/null | head -1)"
          echo "===VERIFY: banner present in re-extracted+re-patched source==="
          grep -RIn "CR6608-RF-38DBM-LINEAR" "$MT76DIR2/mt7915/init.c" \
            || { echo "::error::patch did NOT re-apply through the package pipeline"; exit 1; }
          echo "OK: CR6608 38 dBm patch is in the mt76 package pipeline and re-applies on every extract"

      - name: Build firmware
        run: |
          cd ow
          make -j$(nproc) || make -j1 V=s

      - name: Prove the compiled driver is 38 (strings check)
        run: |
          cd ow
          KO="$(find build_dir bin -name 'mt7915e.ko' 2>/dev/null | head -1)"
          echo "mt7915e.ko: ${KO:-NONE}"
          [ -n "$KO" ] || { echo "mt7915e.ko not found"; exit 1; }
          echo "===1) mt7915e.ko paths after build==="
          find build_dir staging_dir -name "*mt7915*.ko" 2>/dev/null
          echo "===2) DIAGNOSTIC on build_dir .ko==="
          file "$KO"; ls -la "$KO"
          echo "-- strings -a total lines --"; strings -a "$KO" | wc -l
          echo "-- sample module strings --"; strings -a "$KO" | grep -iE "mt7915|vermagic|license|txpower" | head -6
          echo "-- .modinfo (modinfo tool) --"; modinfo "$KO" 2>/dev/null | grep -iE "cr6608|38dbm" || true
          echo "-- CR6608 via strings -a --"; strings -a "$KO" | grep -Ei "CR6608|35DBM|38DBM" || true
          echo "-- CR6608 via raw grep -a --"; grep -a -oE "CR6608[A-Za-z0-9-]*" "$KO" | sort -u | head || true
          # gate: use strings -a (scan the WHOLE file, not just loaded sections)
          if ! strings -a "$KO" | grep -qiE "CR6608-RF-38DBM-LINEAR"; then
            echo "::error::38 banner NOT in compiled .ko — refusing"; exit 1
          fi
          if strings -a "$KO" | grep -qiE "CR6608-RF-35DBM"; then
            echo "::error::stale 35 banner still present"; exit 1
          fi
          echo "===4) FINAL .bin list + sha256==="
          ls -lh bin/targets/ramips/mt7621/*.bin
          sha256sum bin/targets/ramips/mt7621/*sysupgrade.bin
          echo "===5) PROOF: unpack the final sysupgrade.bin and grep the .ko INSIDE it==="
          sudo apt-get install -y squashfs-tools >/dev/null 2>&1 || true
          BIN="$(ls bin/targets/ramips/mt7621/*sysupgrade.bin | head -1)"
          rm -rf /tmp/imgchk && mkdir -p /tmp/imgchk && tar -xf "$BIN" -C /tmp/imgchk 2>/dev/null || true
          ROOT="$(find /tmp/imgchk -name root -type f 2>/dev/null | head -1)"
          echo "squashfs root member: ${ROOT:-NONE}"
          if [ -n "$ROOT" ]; then
            unsquashfs -q -d /tmp/imgchk/sq "$ROOT" >/dev/null 2>&1 || true
            IMGKO="$(find /tmp/imgchk/sq -name 'mt7915e.ko' 2>/dev/null | head -1)"
            echo "mt7915e.ko INSIDE final image: ${IMGKO:-NONE}"
            if [ -n "$IMGKO" ] && strings -a "$IMGKO" | grep -qiE "CR6608-RF-38DBM-LINEAR"; then
              echo "::notice::CONFIRMED — CR6608-RF-38DBM-LINEAR is inside the FINAL firmware .ko"
              strings -a "$IMGKO" | grep -Ei "CR6608|38DBM|35DBM"
            else
              echo "::error::patched banner NOT found inside the final image .ko — image is NOT 38-build"; exit 1
            fi
          else
            echo "::warning::could not unpack image to verify in-image .ko (bin still uploaded)"
          fi
          echo "===6) POWER-PATH GATE: no 35/30 cap, regdb PA=38, enforcement present==="
          if [ -n "$IMGKO" ]; then
            SQ="/tmp/imgchk/sq"
            # a) driver param must be 38, never 35
            strings -a "$IMGKO" | grep -qi "cr6608_rf_38dbm" || { echo "::error::driver param cr6608_rf_38dbm missing"; exit 1; }
            if strings -a "$IMGKO" | grep -qiE "cr6608_rf_35dbm|35DBM"; then echo "::error::stale 35 in driver"; exit 1; fi
            # b) modules.d passes the 38 param
            grep -q "cr6608_rf_38dbm=1" "$SQ/etc/modules.d/mt7915e" || { echo "::error::modules.d not 38"; exit 1; }
            # c) uci baseline txpower 38 on both radios, no '30'/'35' txpower cap in configs/scripts
            if grep -RIn -E "txpower[^0-9]{0,3}(30|35)\b|Selectable up to 35|Maximum TX power[^0-9]{0,6}30" "$SQ/etc" "$SQ/usr/sbin" "$SQ/usr/libexec" 2>/dev/null | grep -viE "1:38|1-38|:38:|txpower-verify"; then
              echo "::error::a 30/35 TX-power cap remains in the rootfs"; exit 1
            fi
            # d) enforcement script present and wired
            test -x "$SQ/usr/sbin/cr6608-force-txpower38" || { echo "::error::force-txpower38 missing"; exit 1; }
            grep -q "cr6608-force-txpower38" "$SQ/etc/hotplug.d/ieee80211/99-cr6608-txpower" || { echo "::error::hotplug not wired to force script"; exit 1; }
            # e) regulatory.db PA must allow 38.0 dBm (max_eirp 3800 mBm) on 2.4G
            python3 "$GITHUB_WORKSPACE/router/cr6608/ubuntu-build/check-regdb-pa.py" "$SQ/lib/firmware/regulatory.db" || { echo "::error::regdb PA < 38 dBm"; exit 1; }
            echo "::notice::POWER-PATH GATE PASSED — 38 everywhere, no 30/35 cap, regdb PA=38, enforcement wired"
          fi

      - name: List output
        run: |
          cd ow
          echo "driver 38dBm patch: ${DRIVER35}"
          ls -la bin/targets/ramips/mt7621/ || true

      - name: Upload sysupgrade image
        uses: actions/upload-artifact@v4
        with:
          name: cr6608-v92-sysupgrade-38dbm-realdriver
          path: ow/bin/targets/ramips/mt7621/*sysupgrade.bin
          if-no-files-found: error
          retention-days: 14

      - name: Publish bin + proofs to fetchable branch (cr6608-bin)
        if: success()
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          BIN="$(ls ow/bin/targets/ramips/mt7621/*sysupgrade.bin | head -1)"
          IMGKO="$(find /tmp/imgchk/sq -name mt7915e.ko 2>/dev/null | head -1)"
          rm -rf /tmp/pub && mkdir -p /tmp/pub
          cp "$BIN" /tmp/pub/cr6608-final-real38-origmpwr-ui-fixed-verified-sysupgrade.bin
          # proofs the owner asked for (2,4,5): sha256, strings of the compiled .ko, patch
          ( cd /tmp/pub && sha256sum *.bin > SHA256SUMS )
          if [ -n "$IMGKO" ]; then strings -a "$IMGKO" | grep -Ei "CR6608|38DBM|35DBM|rf_3[58]|orig_mpwr" > /tmp/pub/mt7915e-strings.txt || true; fi
          cp ow/package/kernel/mt76/patches/999-cr6608-38dbm.patch /tmp/pub/999-cr6608-38dbm.patch 2>/dev/null || true
          cp router/cr6608/ubuntu-build/apply-mt76-38.py /tmp/pub/apply-mt76-38.py
          cd /tmp/pub
          git init -q
          git checkout -q -b cr6608-bin
          git config user.email "ci@local"; git config user.name "cr6608-ci"
          git add -A
          git commit -q -m "CR6608 real38 origmpwr from-source build (run ${GITHUB_RUN_NUMBER})"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" cr6608-bin
          echo "::notice::published bin + proofs to branch cr6608-bin"
