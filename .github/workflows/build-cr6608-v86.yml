name: Build CR6608 v92 (38 dBm from source, real mt76 driver)

# Builds a from-source OpenWrt 24.10.6 image for the Xiaomi CR6608 on GitHub's
# Ubuntu runners (they have the open internet + toolchain this needs). Bakes in
# the full v92 Smart AP overlay (71 cards, argon Obsidian, 1-38 dBm Req/Applied) and the mt76 SKU->38 dBm driver patch (999-mt7915-cr6608-rf-35dbm.patch, 38 content), then
# uploads the flashable sysupgrade .bin as a downloadable artifact.
#
# Run it: GitHub -> Actions -> "Build CR6608 v92 (38 dBm from source, real mt76 driver)" ->
# "Run workflow" (pick this branch). ~1-2 hours. Download the artifact when done.

on:
  workflow_dispatch:
    inputs:
      openwrt_ref:
        description: 'OpenWrt git ref to build (the shipped SmartAP CR6608 images are 25.12.5)'
        required: true
        default: 'v25.12.5'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          echo "== before =="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "== after =="; df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget quilt \
            libelf-dev ecj fastjar java-propose-classpath

      - name: Clone OpenWrt
        env:
          # Passed through the environment, never interpolated into the shell text, so a
          # crafted dispatch input cannot inject commands.
          OPENWRT_REF: ${{ github.event.inputs.openwrt_ref || 'v25.12.5' }}
        run: |
          git clone https://git.openwrt.org/openwrt/openwrt.git ow
          cd ow
          git checkout "$OPENWRT_REF"
          git log -1 --oneline

      - name: Update & install feeds
        run: |
          cd ow
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Bake in the v92 overlay
        run: |
          cd ow
          mkdir -p files
          cp -a "$GITHUB_WORKSPACE/router/cr6608/ubuntu-build/files/." files/
          chmod 0755 files/usr/sbin/* 2>/dev/null || true
          # ensure a regulatory.db exists (ours is patched: 36 dBm, no DFS)
          test -s files/lib/firmware/regulatory.db && echo "regdb present" || true
          find files -type f | wc -l

      - name: Seed .config and expand
        run: |
          cd ow
          cp "$GITHUB_WORKSPACE/router/cr6608/ubuntu-build/cr6608.seed.config" .config
          make defconfig
          grep -q 'CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-cr6608=y' .config \
            && echo "device profile selected" \
            || { echo "device profile NOT selected"; exit 1; }
          # `make defconfig` SILENTLY drops any CONFIG_PACKAGE_* it cannot resolve (renamed
          # or removed at this ref), so a curated feature can vanish with no error. Assert
          # every explicitly requested =y package survived the expansion.
          missing=""
          while IFS= read -r sym; do
            grep -qxF "$sym" .config || missing="$missing ${sym%=y}"
          done < <(grep -E '^CONFIG_PACKAGE_[A-Za-z0-9._-]+=y' \
                     "$GITHUB_WORKSPACE/router/cr6608/ubuntu-build/cr6608.seed.config")
          # NOTE: warn, do not fail. Virtual/PROVIDES packages (e.g. nftables -> nftables-json)
          # and dependency-pulled apps legitimately do not appear as a literal =y line even
          # though they end up in the image, so a hard failure here false-positives. The
          # warning still surfaces anything genuinely renamed for review in the build log.
          if [ -n "$missing" ]; then
            echo "::warning::packages not present as a literal =y after defconfig (may be virtual/dependency-provided, review):$missing"
          else
            echo "all curated packages survived defconfig"
          fi

      - name: Download sources
        run: cd ow && make download -j8 V=s

      - name: Apply CR6608 38 dBm mt76 driver patch (targeted, with before/after proof)
        run: |
          cd ow
          make package/kernel/mt76/prepare V=s QUILT=1 2>&1 | tail -3 || \
            make package/kernel/mt76/prepare V=s 2>&1 | tail -3 || true
          MT76DIR="$(find build_dir -maxdepth 5 -type d -name 'mt76-*' 2>/dev/null | head -1)"
          echo "===MT76DIR=== ${MT76DIR:-NONE}"
          [ -n "$MT76DIR" ] || { echo "no mt76 dir"; exit 1; }
          export MT76DIR
          # Same mechanism as the Q20 build (proven end to end): patch the EEPROM target-power
          # accessor in mt7915/eeprom.c so it returns 76 half-dBm (= 38.0 dBm), carrying a
          # proof marker the gate below greps out of the final compiled module.
          cp "$MT76DIR/mt7915/eeprom.c" "$MT76DIR/mt7915/eeprom.c.orig"
          echo "===BEFORE: target-power accessor==="
          grep -n "mt7915_eeprom_get_target_power" "$MT76DIR/mt7915/eeprom.c" | head -5
          python3 "$GITHUB_WORKSPACE/router/cr6608/ubuntu-build/apply-mt76-38.py" "$MT76DIR"
          echo "===DIFF mt7915/eeprom.c==="
          diff -u "$MT76DIR/mt7915/eeprom.c.orig" "$MT76DIR/mt7915/eeprom.c" || true
          # Persist the edit as a REAL package patch so it is re-applied on EVERY (re)prepare
          # of mt76. Enabling extra kmods reconfigures the kernel, which re-prepares
          # out-of-tree modules like mt76 from pristine source during the full `make` — that
          # silently wipes an in-place build_dir edit and the marker gate then (correctly)
          # refuses the image. A patch in package/kernel/mt76/patches/ survives re-prepares.
          mkdir -p package/kernel/mt76/patches
          diff -u -L a/mt7915/eeprom.c -L b/mt7915/eeprom.c \
            "$MT76DIR/mt7915/eeprom.c.orig" "$MT76DIR/mt7915/eeprom.c" \
            > package/kernel/mt76/patches/999-smartap-cr6608-38dbm.patch || true
          rm -f "$MT76DIR/mt7915/eeprom.c.orig"
          echo "===persisted package patch==="
          cat package/kernel/mt76/patches/999-smartap-cr6608-38dbm.patch
          test -s package/kernel/mt76/patches/999-smartap-cr6608-38dbm.patch \
            || { echo "::error::38 dBm patch is empty — refusing"; exit 1; }
          # Clean so the full build re-extracts pristine mt76 and applies ALL patches, ours
          # included — guaranteeing the marker lands in the compiled mt7915e.ko.
          make package/kernel/mt76/clean V=s 2>&1 | tail -2 || true

      - name: Build firmware
        run: |
          cd ow
          make -j$(nproc) || make -j1 V=s

      - name: Prove the compiled driver is 38 (strings check)
        run: |
          cd ow
          KO="$(find build_dir bin -name 'mt7915e.ko' 2>/dev/null | head -1)"
          echo "mt7915e.ko: ${KO:-NONE}"
          [ -n "$KO" ] || { echo "mt7915e.ko not found"; exit 1; }
          echo "===1) mt7915e.ko paths after build==="
          find build_dir staging_dir -name "*mt7915*.ko" 2>/dev/null
          echo "===2) DIAGNOSTIC on build_dir .ko==="
          file "$KO"; ls -la "$KO"
          echo "-- strings -a total lines --"; strings -a "$KO" | wc -l
          echo "-- sample module strings --"; strings -a "$KO" | grep -iE "mt7915|vermagic|license|txpower" | head -6
          echo "-- .modinfo (modinfo tool) --"; modinfo "$KO" 2>/dev/null | grep -iE "cr6608|38dbm" || true
          echo "-- CR6608 via strings -a --"; strings -a "$KO" | grep -Ei "CR6608|35DBM|38DBM" || true
          echo "-- CR6608 via raw grep -a --"; grep -a -oE "CR6608[A-Za-z0-9-]*" "$KO" | sort -u | head || true
          # gate: use strings -a (scan the WHOLE file, not just loaded sections)
          if ! strings -a "$KO" | grep -qE "SMARTAP-CR6608-RF-38DBM-LINEAR"; then
            echo "::error::38 banner NOT in compiled .ko — refusing"; exit 1
          fi
          if strings -a "$KO" | grep -qiE "CR6608-RF-35DBM"; then
            echo "::error::stale 35 banner still present"; exit 1
          fi
          echo "===4) FINAL .bin list + sha256==="
          ls -lh bin/targets/ramips/mt7621/*.bin
          sha256sum bin/targets/ramips/mt7621/*sysupgrade.bin
          echo "===5) PROOF: unpack the final sysupgrade.bin and grep the .ko INSIDE it==="
          sudo apt-get install -y squashfs-tools >/dev/null 2>&1 || true
          BIN="$(ls bin/targets/ramips/mt7621/*sysupgrade.bin | head -1)"
          rm -rf /tmp/imgchk && mkdir -p /tmp/imgchk && tar -xf "$BIN" -C /tmp/imgchk 2>/dev/null || true
          ROOT="$(find /tmp/imgchk -name root -type f 2>/dev/null | head -1)"
          echo "squashfs root member: ${ROOT:-NONE}"
          if [ -n "$ROOT" ]; then
            unsquashfs -q -d /tmp/imgchk/sq "$ROOT" >/dev/null 2>&1 || true
            IMGKO="$(find /tmp/imgchk/sq -name 'mt7915e.ko' 2>/dev/null | head -1)"
            echo "mt7915e.ko INSIDE final image: ${IMGKO:-NONE}"
            if [ -n "$IMGKO" ] && strings -a "$IMGKO" | grep -qE "SMARTAP-CR6608-RF-38DBM-LINEAR"; then
              echo "::notice::CONFIRMED — CR6608-RF-38DBM-LINEAR is inside the FINAL firmware .ko"
              strings -a "$IMGKO" | grep -Ei "CR6608|38DBM|35DBM"
            else
              echo "::error::patched banner NOT found inside the final image .ko — image is NOT 38-build"; exit 1
            fi
          else
            echo "::warning::could not unpack image to verify in-image .ko (bin still uploaded)"
          fi

      - name: List output
        run: |
          cd ow
          echo "driver 38dBm patch: ${DRIVER35}"
          ls -la bin/targets/ramips/mt7621/ || true

      - name: Upload sysupgrade image
        uses: actions/upload-artifact@v4
        with:
          name: cr6608-v92-sysupgrade-38dbm-realdriver
          path: ow/bin/targets/ramips/mt7621/*sysupgrade.bin
          if-no-files-found: error
          retention-days: 14
