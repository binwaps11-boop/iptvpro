name: Build KT412 DSA (experimental)

# EXPERIMENTAL: full source build of OpenWrt main + PR #21837
# (ath79: dw02-412h migrate swconfig -> DSA). ~45-90 min. May fail / need iteration.

on:
  workflow_dispatch:
  push:
    branches: [ "claude/kt412-openwrt-custom-lzcgo1" ]
    paths:
      - ".github/workflows/build-kt412-dsa.yml"
      - "openwrt-kt412/dsa/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: Checkout repo (for config + files)
        uses: actions/checkout@v4
        with:
          path: kt

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            ccache ecj fastjar java-propose-classpath libelf-dev

      - name: "Checkout OpenWrt + apply PR 21837 (DSA)"
        run: |
          git clone https://github.com/openwrt/openwrt.git
          cd openwrt
          git fetch origin pull/21837/head:dsa
          git checkout dsa
          echo "HEAD: $(git log --oneline -1)"
          echo "DSA-related files changed by PR:"
          git diff --name-only main...dsa 2>/dev/null | grep -i 'dw02-412h\|412h' || true
          # --- Fix the PR's DTS syntax error: a LED property is missing its ';' ---
          DTSI="target/linux/ath79/dts/qca9558_dongwon_dw02-412h.dtsi"
          if grep -q 'linux,default-trigger = "phy1tpt"$' "$DTSI"; then
            sed -i 's/\(linux,default-trigger = "phy1tpt"\)$/\1;/' "$DTSI"
            echo "PATCHED: added missing semicolon in $DTSI"
          fi
          echo "--- phy1tpt line(s) after patch ---"
          grep -n 'phy1tpt' "$DTSI" || true

      - name: Update & install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cd openwrt
          cp "$GITHUB_WORKSPACE/kt/openwrt-kt412/dsa/config.seed" .config
          make defconfig
          echo "=== device selected? ==="
          grep -i 'dw02-412h' .config || { echo "DEVICE NOT IN CONFIG"; exit 1; }
          echo "=== DSA confirm: board.d for dw02-412h ==="
          grep -A4 'dw02-412h' target/linux/ath79/*/base-files/etc/board.d/02_network 2>/dev/null | head || true

      - name: "Add files overlay (DSA-safe configs + custom purple dashboard)"
        run: |
          cd openwrt
          # DSA-safe base (mgmt IP, theme, uci-defaults) — lets DSA board.d build the network
          cp -a "$GITHUB_WORKSPACE/kt/openwrt-kt412/dsa/files" ./files
          # Custom KT412 purple-glass dashboard (network-agnostic: www + cgi-bin api)
          mkdir -p ./files/www ./files/root
          cp -a "$GITHUB_WORKSPACE/kt/openwrt-kt412/files/www/." ./files/www/
          cp -a "$GITHUB_WORKSPACE/kt/openwrt-kt412/files/root/." ./files/root/ 2>/dev/null || true
          chmod +x files/etc/uci-defaults/* || true
          chmod 0755 files/www/cgi-bin/kt412 || true
          chmod 0755 files/root/*.sh 2>/dev/null || true
          find files -type f

      - name: Download sources
        run: |
          cd openwrt
          make -j$(nproc) download || make -j1 download

      - name: "Patch ath9k 2.4G power to 30 dBm (consented bypass) - MUST apply"
        run: |
          cd openwrt
          echo "=== build tools + toolchain first so the kernel source actually extracts ==="
          make -j$(nproc) tools/install    || make -j1 tools/install
          make -j$(nproc) toolchain/install || make -j1 toolchain/install
          echo "=== extract + prepare kernel (so ath9k source exists to patch) ==="
          make -j$(nproc) target/linux/prepare || make -j1 V=s target/linux/prepare
          EEP="$(find build_dir -path '*ath9k/ar9003_eeprom.c' 2>/dev/null | head -1)"
          if [ -z "$EEP" ]; then
            echo "FATAL: ar9003_eeprom.c not found after prepare - cannot apply power patch."
            echo "Refusing to ship a DSA bin that claims 30 but isn't patched."
            exit 1
          fi
          echo "Found: $EEP"
          cp "$EEP" "$EEP.orig"
          # 1) ignore the conservative CTL edge clamp on 2.4G target power
          sed -i 's/minCtlPower = (u8)min(twiceMaxEdgePower, scaledPower);/minCtlPower = scaledPower; \/* KT412-30dbm *\//' "$EEP"
          # 2) RAISE the 2.4G per-rate target CEILING to 63 half-dB (=31.5 dBm) so the
          #    caldata 24 cap no longer limits; the ACTUAL applied power is then chosen
          #    at runtime by uci txpower (Safe 24 / Max 26 / Extreme 30 from the UI).
          sed -i 's/\(regulatory->max_power_level = 0;\)/{ int _k; for (_k = 0; _k < ar9300RateSize; _k++) if (targetPowerValT2[_k] < 63) targetPowerValT2[_k] = 63; } \/* KT412-30dbm *\/ \1/' "$EEP"
          M="$(grep -c 'KT412-30dbm' "$EEP")"
          echo "--- power-patch markers (need 2): $M ---"
          echo "--- diff ---"; diff "$EEP.orig" "$EEP" || true
          if [ "$M" != "2" ]; then
            echo "FATAL: power patch did not apply cleanly (markers=$M). Aborting."
            exit 1
          fi
          echo "POWER PATCH APPLIED OK (2.4G target forced to 30 dBm)."

      - name: Build
        run: |
          cd openwrt
          make -j$(nproc) || (echo '=== retry verbose for error ==='; make -j1 V=s 2>&1 | tail -200; exit 1)
          # prove the patched object is in the kernel build
          echo "=== confirm patched source compiled ==="
          grep -c 'KT412-30dbm' build_dir/target-*/linux-*/linux-*/drivers/net/wireless/ath/ath9k/ar9003_eeprom.c 2>/dev/null || true

      - name: Collect images
        id: collect
        run: |
          cd openwrt
          BIN="bin/targets/ath79/nand"
          ls -lh "$BIN" || true
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$BIN"/*dw02-412h-128m*sysupgrade.bin "$GITHUB_WORKSPACE/out/openwrt-kt412-DSA-sysupgrade.bin" || true
          cp "$BIN"/*dw02-412h-128m*factory.img    "$GITHUB_WORKSPACE/out/openwrt-kt412-DSA-factory.img" || true
          cp "$BIN"/*.manifest                      "$GITHUB_WORKSPACE/out/openwrt-kt412-DSA.manifest" || true
          cd "$GITHUB_WORKSPACE/out" && sha256sum * > SHA256-DSA.txt && cat SHA256-DSA.txt
          # sanity: rootfs must contain init (catch broken build)
          test -s openwrt-kt412-DSA-sysupgrade.bin || { echo "NO SYSUPGRADE PRODUCED"; exit 1; }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kt412-dsa
          path: out/*
          if-no-files-found: warn

      - name: Publish to Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kt412-dsa
          name: KT412 DSA (experimental, snapshot + PR #21837)
          body: |
            EXPERIMENTAL DSA build. Switch is DSA (qca8k), not swconfig.
            Snapshot from OpenWrt main + PR #21837. Less stable than 23.05.5.
            Flash via U-Boot factory.img + bootpart 2, or LuCI sysupgrade.
            Recovery: U-Boot TFTP if it breaks.
          files: out/*
          fail_on_unmatched_files: false
