name: Build CR6606 from SOURCE (Xiaomi AX1800 WiFi6 · DSA · Smart AP)

# FULL SOURCE build (من الصفر) of OpenWrt for the Xiaomi Mi Router CR6606.
#   target  : ramips/mt7621  (MT7621AT dual-core)  -- DSA is NATIVE here (mt7530)
#   radios  : MT7915 WiFi6 AX1800 (mt76 / kmod-mt7915e), pulled by the device profile
#   profile : xiaomi_mi-router-cr6606  (officially supported -> no source patches)
# Bakes in the Smart AP dashboard/theme/CGI overlay (openwrt-cr6606/files).
# NO power/regulatory edits. Branch openwrt-24.10 = latest stable that reliably works.

on:
  workflow_dispatch:
  push:
    branches: [ "claude/kt412-openwrt-custom-lzcgo1" ]
    paths:
      - ".github/workflows/build-cr6606-src.yml"
      - "openwrt-cr6606/files/**"

permissions:
  contents: write

concurrency:
  group: cr6606-src-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout repo (overlay)
        uses: actions/checkout@v4
        with: { path: kt }

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget zstd ccache

      - name: Checkout OpenWrt source (openwrt-24.10, latest stable)
        run: |
          set -eux
          git clone --depth 1 -b openwrt-24.10 https://github.com/openwrt/openwrt.git
          cd openwrt
          git log --oneline -1

      - name: Update + install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure (.config seed for cr6606 + Smart AP packages)
        run: |
          cd openwrt
          # build .config with clean (un-indented) KConfig lines
          {
            echo 'CONFIG_TARGET_ramips=y'
            echo 'CONFIG_TARGET_ramips_mt7621=y'
            echo 'CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-cr6606=y'
            echo 'CONFIG_PACKAGE_luci=y'
            echo 'CONFIG_PACKAGE_luci-ssl=y'
            echo 'CONFIG_PACKAGE_luci-i18n-base-ar=y'
            echo 'CONFIG_PACKAGE_curl=y'
            echo 'CONFIG_PACKAGE_wpad-openssl=y'
            echo 'CONFIG_PACKAGE_kmod-mt7915e=y'
            echo 'CONFIG_PACKAGE_kmod-mt7915-firmware=y'
          } > .config
          make defconfig
          echo "=== verify cr6606 selected ==="
          grep -E "DEVICE_xiaomi_mi-router-cr6606=y" .config || { echo "FATAL: cr6606 not selected"; exit 1; }
          echo "=== verify DSA (mt7621 uses DSA natively) ==="
          grep -E "CONFIG_TARGET_ramips_mt7621=y" .config

      - name: Add Smart AP files overlay
        run: |
          cd openwrt
          mkdir -p files
          cp -a "$GITHUB_WORKSPACE/kt/openwrt-cr6606/files/." files/
          echo "=== overlay contents ==="; find files -type f | head -60; echo "total: $(find files -type f | wc -l)"

      - name: Download sources
        run: |
          cd openwrt
          make -j$(nproc) download V=s 2>&1 | tail -20

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s 2>&1 | tail -200 || { echo "parallel failed, retry single-thread for clear error"; make -j1 V=s 2>&1 | tail -200; exit 1; }

      - name: Collect + checksum
        run: |
          set -eux
          cd openwrt
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp bin/targets/ramips/mt7621/*cr6606*sysupgrade.bin "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          cp bin/targets/ramips/mt7621/*cr6606*factory.bin     "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          cp bin/targets/ramips/mt7621/*cr6606*initramfs*.bin  "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          cp bin/targets/ramips/mt7621/*cr6606*.manifest       "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          cd "$GITHUB_WORKSPACE/out"; ls -la
          sha256sum *.bin > sha256-cr6606-src.txt; cat sha256-cr6606-src.txt
          test -s "$(ls *sysupgrade.bin 2>/dev/null | head -1)" || { echo "NO SYSUPGRADE IMAGE"; exit 1; }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: cr6606-smartap-src, path: out/*, if-no-files-found: warn }

      - name: Publish to Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: cr6606-smartap-src
          name: CR6606 Smart AP — SOURCE build (Xiaomi AX1800 WiFi6 · DSA)
          body: |
            Full SOURCE build of OpenWrt openwrt-24.10 for Xiaomi CR6606
            (ramips/mt7621, MT7621AT + MT7915 WiFi6 AX1800). DSA native (mt7530).
            Smart AP dashboard/theme/CGI overlay + LuCI. No power/regulatory edits.
            Already-OpenWrt device: flash sysupgrade.bin directly (sysupgrade -n).
          files: out/*
          fail_on_unmatched_files: false
