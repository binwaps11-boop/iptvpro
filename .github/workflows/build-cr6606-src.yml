name: Build CR6606 from SOURCE (2 variants · all-channels power-measured · DSA)

# FULL SOURCE build (من الصفر) of OpenWrt for the Xiaomi Mi Router CR6606.
#   target  : ramips/mt7621 (MT7621AT)  -- DSA is NATIVE here (mt7530), no patches
#   radios  : MT7915 WiFi6 AX1800 (mt76 / kmod-mt7915e), 2x2/2x2
#   profile : xiaomi_mi-router-cr6606 (officially supported)
# Builds TWO variants via matrix, each = shared Smart-AP overlay + a per-variant
# uci-defaults overlay + the in-system measurement scripts:
#   - clean-stable-longrange       -> release tag cr6606-clean-stable
#   - system-30dbm-measured-test   -> release tag cr6606-30dbm-measured (markers + tools)
# NO power/regulatory/caldata patches. txpower=30 is an honest UCI request; the bundled
# scripts MEASURE the real per-channel output (no fake numbers).

on:
  workflow_dispatch:
  push:
    branches: [ "claude/kt412-openwrt-custom-lzcgo1" ]
    paths:
      - ".github/workflows/build-cr6606-src.yml"
      - "openwrt-cr6606/files/**"
      - "openwrt-cr6606/variants/**"

permissions:
  contents: write

concurrency:
  group: cr6606-src-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: clean-stable-longrange
            tag:  cr6606-clean-stable
            title: "CR6606 clean-stable-longrange — SOURCE (AX1800 · DSA)"
          - name: system-30dbm-measured-test
            tag:  cr6606-30dbm-measured
            title: "CR6606 system-30dbm-measured-test — SOURCE (all-channels proof)"
    steps:
      - name: Checkout repo (overlay)
        uses: actions/checkout@v4
        with: { path: kt }

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync \
            swig unzip zlib1g-dev file wget zstd ccache

      - name: Checkout OpenWrt source (openwrt-24.10, latest stable)
        run: |
          set -eux
          git clone --depth 1 -b openwrt-24.10 https://github.com/openwrt/openwrt.git
          cd openwrt
          git log --oneline -1

      - name: Update + install feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure (.config seed for cr6606 + Smart AP + measurement tools)
        run: |
          cd openwrt
          {
            echo 'CONFIG_TARGET_ramips=y'
            echo 'CONFIG_TARGET_ramips_mt7621=y'
            echo 'CONFIG_TARGET_ramips_mt7621_DEVICE_xiaomi_mi-router-cr6606=y'
            echo 'CONFIG_PACKAGE_luci=y'
            echo 'CONFIG_PACKAGE_luci-ssl=y'
            echo 'CONFIG_PACKAGE_luci-i18n-base-ar=y'
            echo 'CONFIG_PACKAGE_curl=y'
            echo 'CONFIG_PACKAGE_wpad-openssl=y'
            echo 'CONFIG_PACKAGE_kmod-mt7915e=y'
            echo 'CONFIG_PACKAGE_kmod-mt7915-firmware=y'
            echo 'CONFIG_PACKAGE_iw=y'
            echo 'CONFIG_PACKAGE_iwinfo=y'
            echo 'CONFIG_PACKAGE_kmod-nft-offload=y'
          } > .config
          make defconfig
          echo "=== verify cr6606 selected ==="
          grep -E "DEVICE_xiaomi_mi-router-cr6606=y" .config || { echo "FATAL: cr6606 not selected"; exit 1; }
          grep -E "CONFIG_TARGET_ramips_mt7621=y" .config

      - name: Add Smart AP overlay (shared base + variant ${{ matrix.name }})
        run: |
          set -eux
          cd openwrt
          rm -rf files; mkdir -p files
          cp -a "$GITHUB_WORKSPACE/kt/openwrt-cr6606/files/." files/
          cp -a "$GITHUB_WORKSPACE/kt/openwrt-cr6606/variants/${{ matrix.name }}/." files/
          echo "=== overlay contents (variant ${{ matrix.name }}) ==="
          find files -type f | sort | head -80; echo "total: $(find files -type f | wc -l)"
          echo "=== uci-defaults present ==="; ls -la files/etc/uci-defaults/

      - name: Download sources
        run: |
          cd openwrt
          make -j$(nproc) download V=s 2>&1 | tail -20

      - name: Build firmware
        run: |
          cd openwrt
          make -j$(nproc) V=s 2>&1 | tail -200 || { echo "parallel failed, retry single-thread"; make -j1 V=s 2>&1 | tail -200; exit 1; }

      - name: Collect + checksum (rename to variant name)
        run: |
          set -eux
          cd openwrt
          OUT="$GITHUB_WORKSPACE/out"; mkdir -p "$OUT"
          SRC="$(ls bin/targets/ramips/mt7621/*cr6606*sysupgrade.bin | head -1)"
          test -s "$SRC" || { echo "NO SYSUPGRADE IMAGE"; exit 1; }
          cp "$SRC" "$OUT/cr6606-${{ matrix.name }}-sysupgrade.bin"
          cp bin/targets/ramips/mt7621/*cr6606*factory.bin    "$OUT/cr6606-${{ matrix.name }}-factory.bin" 2>/dev/null || true
          cp bin/targets/ramips/mt7621/*cr6606*.manifest      "$OUT/cr6606-${{ matrix.name }}.manifest" 2>/dev/null || true
          cd "$OUT"; ls -la
          sha256sum *.bin > "sha256-${{ matrix.name }}.txt"; cat "sha256-${{ matrix.name }}.txt"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: "cr6606-${{ matrix.name }}", path: out/*, if-no-files-found: warn }

      - name: Publish to Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ matrix.tag }}
          name: ${{ matrix.title }}
          body: |
            Full SOURCE build of OpenWrt openwrt-24.10 for Xiaomi CR6606
            (ramips/mt7621, MT7915 WiFi6 AX1800 2x2/2x2). DSA native (mt7530).
            Variant: ${{ matrix.name }}. Smart AP UI + LuCI + SSH + flow offloading.
            txpower=30 request on both radios; NO regulatory/caldata patch, NO MAC change.
            In-system proof tools: /root/cr6606_power_truth.sh and
            /root/cr6606_all_channels_test.sh (measure every 2.4G+5G channel).
            See openwrt-cr6606/CR6606-POWER-REPORT.md for the clamp analysis.
            Flash: sysupgrade -n /tmp/cr6606.bin
          files: out/*
          fail_on_unmatched_files: false
