services:
  iptvpro:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: iptvpro:latest
    container_name: iptvpro
    restart: always
    ports:
      - "2222:2222"
    environment:
      - PORT=2222
      - ADMIN_USER=admin
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-change-me}
      - CONFIG_DIR=/app/data
    volumes:
      - iptvpro_data:/app/data

volumes:
  iptvpro_data:
