# This AP is IPv4-only (management + rescue). The from-source kernel ships the
# IPv6 stack; silence it so no interface ever gets a v6 address. Bridged client
# IPv6 frames still pass at L2 — only the router's own stack is muted.
net.ipv6.conf.all.disable_ipv6 = 1
net.ipv6.conf.default.disable_ipv6 = 1
