# Connection-tracking sizing for a Smart AP that may also ROUTE/NAT for a large
# Wi-Fi fleet (maxassoc is 200 per radio). Two failure modes this prevents:
#
#  1) Table exhaustion. When this box is the gateway, 200+ clients each opening
#     dozens of flows can fill the stock conntrack table; once full, the kernel
#     drops NEW connections ("nf_conntrack: table full") and users see random
#     "can't connect" while existing flows keep working. 32768 entries is a
#     comfortable ceiling for this SoC without wasting scarce 256 MB RAM.
#
#  2) Slow reclaim. The mainline ESTABLISHED timeout is 5 DAYS, so a busy AP
#     hoards long-dead flows for days. Cutting it to 1 day (still far longer
#     than any real idle session with keepalives) keeps the table lean and
#     bounded, which is what actually protects stability under churn.
#
# These keys exist only while nf_conntrack is loaded — i.e. when the box is
# routing/NAT. On a pure bridged AP the module is absent and every line below is
# a harmless no-op (a boot-time warning at most). Applied once at boot; if you
# switch a bridge into a router, reboot so the tuning takes effect.
net.netfilter.nf_conntrack_max=32768
# Size the hash table to match the raised ceiling (~64 KB, negligible on 256 MB) so lookups
# stay O(1) at high flow counts instead of walking long chains.
net.netfilter.nf_conntrack_buckets=8192
net.netfilter.nf_conntrack_tcp_timeout_established=86400
net.netfilter.nf_conntrack_tcp_timeout_time_wait=30
net.netfilter.nf_conntrack_tcp_timeout_close_wait=30
net.netfilter.nf_conntrack_udp_timeout_stream=120
