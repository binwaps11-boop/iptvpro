# Smart AP performance: headroom for many concurrent clients and fast forwarding.
# Larger connection table + backlog so dozens of devices streaming at once don't stall.
net.netfilter.nf_conntrack_max=65536
net.netfilter.nf_conntrack_tcp_timeout_established=7200
net.core.netdev_max_backlog=4096
net.core.rmem_max=4194304
net.core.wmem_max=4194304
net.ipv4.tcp_fastopen=3
net.bridge.bridge-nf-call-iptables=0
net.bridge.bridge-nf-call-ip6tables=0
net.bridge.bridge-nf-call-arptables=0
# No IPv6 on this AP (kernel has no IPv6 anyway; this is a hard guarantee).
net.ipv6.conf.all.disable_ipv6=1
net.ipv6.conf.default.disable_ipv6=1
net.ipv6.conf.all.accept_ra=0
# --- Performance pack v79: faster packet path + bigger TCP pipes (no reboots, no power cuts) ---
net.core.netdev_budget=600
net.core.netdev_budget_usecs=8000
net.core.somaxconn=4096
net.core.optmem_max=65536
net.ipv4.tcp_rmem=4096 131072 4194304
net.ipv4.tcp_wmem=4096 131072 4194304
net.ipv4.tcp_mtu_probing=1
net.ipv4.tcp_slow_start_after_idle=0
