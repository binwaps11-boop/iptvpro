<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <meta http-equiv="Cache-Control" content="no-store">
  <title>Smart AP</title>
  <style>
    /* ============ ROYAL OBSIDIAN — deep black royal luxury ============ */
    :root {
      --bg:#05060B; --bg2:#0B0F1D; --section:#090D19; --card:#0A101F; --raised:#101729;
      --border:rgba(132,168,255,.11); --edge:rgba(56,189,248,.38);
      --text:#EDF2FC; --muted:#94A2C0; --faint:#5E6B8C;
      --primary:#3B82F6; --accent:#06B6D4; --excellent:#10B981; --good:#84CC16;
      --mid:#F59E0B; --weak:#EF4444; --critical:#DC2626;
      --grad:linear-gradient(135deg,#2563EB,#06B6D4);
      --hero:linear-gradient(168deg,#0D1530 0%,#080D1D 52%,#04060E 100%);
      --shadow:0 30px 90px rgba(0,0,0,.55);
      --sheen:inset 0 1px 0 rgba(178,205,255,.09);
      color-scheme:dark;
    }
    html[data-theme="light"] {
      --bg:#E9EEF8; --bg2:#F5F8FE; --section:#F6F9FE; --card:#FFFFFF; --raised:#EDF2FA;
      --border:rgba(18,32,71,.12); --edge:rgba(37,99,235,.40);
      --text:#0B1226; --muted:#43506E; --faint:#68748F;
      --shadow:0 24px 70px rgba(18,32,71,.14);
      --sheen:inset 0 1px 0 rgba(255,255,255,.9);
      color-scheme:light;
    }
    * { box-sizing:border-box; }
    html, body { min-height:100%; margin:0; }
    body {
      overflow-x:hidden; color:var(--text);
      background:
        radial-gradient(1100px 560px at 50% -14%, rgba(37,99,235,.17), transparent 62%),
        radial-gradient(820px 480px at 90% 8%, rgba(6,182,212,.10), transparent 60%),
        radial-gradient(760px 640px at 4% 88%, rgba(30,64,175,.13), transparent 64%),
        linear-gradient(180deg,#05060B 0%,#0B0F1D 100%);
      background-attachment:fixed;
      font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif; letter-spacing:0;
      font-variant-numeric:tabular-nums;
    }
    html[data-theme="light"] body {
      background:
        radial-gradient(46% 34% at 18% -6%, rgba(96,165,250,.22), transparent 70%),
        radial-gradient(42% 30% at 82% -4%, rgba(167,139,250,.18), transparent 68%),
        radial-gradient(50% 36% at 60% 104%, rgba(34,211,238,.14), transparent 70%),
        linear-gradient(180deg,#E7ECF9 0%,#F3F6FD 100%);
      background-attachment:fixed;
    }
    body::before {
      content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.5;
      background-image:radial-gradient(circle, rgba(148,185,255,.13) 1px, transparent 1.5px);
      background-size:30px 30px;
      -webkit-mask-image:radial-gradient(120% 90% at 50% 0%, #000 0%, transparent 72%);
      mask-image:radial-gradient(120% 90% at 50% 0%, #000 0%, transparent 72%);
    }
    html[data-theme="light"] body::before { opacity:.4; background-image:radial-gradient(circle, rgba(37,99,235,.16) 1px, transparent 1.5px); }
    button, input, select { font:inherit; }
    button { color:inherit; cursor:pointer; }
    a { color:inherit; text-decoration:none; }
    :where(button,input,select,a):focus-visible { outline:2px solid rgba(56,189,248,.75); outline-offset:2px; }
    ::selection { background:rgba(37,99,235,.45); color:#fff; }
    .app {
      width:min(100%,1480px); margin-inline:auto; padding:16px;
      display:grid; grid-template-columns:244px minmax(0,1fr); gap:16px;
    }
    /* ---------- sidebar: floating obsidian panel ---------- */
    .side {
      position:sticky; top:16px; height:calc(100vh - 32px); min-height:620px;
      border:1px solid var(--border); border-radius:20px;
      background:linear-gradient(180deg,rgba(14,20,38,.86),rgba(6,10,21,.92));
      backdrop-filter:blur(18px);
      box-shadow:var(--shadow), var(--sheen);
      padding:14px; display:flex; flex-direction:column; gap:14px;
    }
    html[data-theme="light"] .side { background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(244,248,254,.94)); }
    .brand { display:flex; align-items:center; gap:12px; min-width:0; padding:8px; }
    .mark {
      width:42px; height:42px; border-radius:14px; background:var(--grad);
      display:grid; place-items:center; position:relative;
      box-shadow:0 0 26px rgba(6,182,212,.38), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -8px 16px rgba(2,6,18,.35);
    }
    .mark svg, .ico { width:21px; height:21px; display:block; }
    .brand h1 { margin:0; font-size:17px; line-height:1.2; font-weight:800; letter-spacing:.01em; }
    .brand p { margin:4px 0 0; color:var(--muted); font-size:12px; }
    .nav { display:grid; gap:8px; }
    .nav button {
      min-height:44px; border:1px solid transparent; border-radius:14px; background:transparent;
      color:var(--muted); display:grid; grid-template-columns:26px minmax(0,1fr); align-items:center;
      gap:8px; padding:0 12px; text-align:start; transition:.22s; font-weight:600;
    }
    .nav button:hover { color:var(--text); background:rgba(96,140,255,.07); }
    .nav button.active {
      color:var(--text); border-color:rgba(56,189,248,.36);
      background:linear-gradient(135deg,rgba(37,99,235,.26),rgba(6,182,212,.10));
      box-shadow:0 0 26px rgba(37,99,235,.22), inset 0 1px 0 rgba(190,220,255,.14);
    }
    html[data-theme="light"] .nav button.active { background:linear-gradient(135deg,rgba(37,99,235,.14),rgba(6,182,212,.08)); box-shadow:0 6px 20px rgba(37,99,235,.14); }
    .side-foot {
      margin-top:auto; border:1px solid var(--border); border-radius:16px; padding:12px;
      color:var(--muted); background:linear-gradient(180deg,rgba(20,28,52,.55),rgba(8,12,24,.55));
      font-size:12px; line-height:1.65; box-shadow:var(--sheen);
    }
    html[data-theme="light"] .side-foot { background:#F3F7FD; }
    .main { min-width:0; display:grid; gap:16px; }
    /* ---------- hero: cinematic obsidian slab (stays royal-dark in both themes) ---------- */
    .hero {
      position:relative; overflow:hidden; min-height:248px; border-radius:22px;
      border:1px solid rgba(126,166,255,.17); color:#EDF2FC;
      background:
        radial-gradient(760px 330px at 84% -34%, rgba(6,182,212,.30), transparent 62%),
        radial-gradient(560px 300px at 8% 118%, rgba(37,99,235,.27), transparent 62%),
        radial-gradient(circle, rgba(148,185,255,.10) 1px, transparent 1.6px) 0 0/26px 26px,
        var(--hero);
      box-shadow:0 34px 100px rgba(0,0,0,.6), inset 0 1px 0 rgba(178,208,255,.16);
      padding:clamp(18px,3vw,30px); display:grid; gap:18px;
    }
    .hero::before {
      content:""; position:absolute; inset:0 8% auto; height:1px; z-index:1;
      background:linear-gradient(90deg,transparent,rgba(103,232,249,1),rgba(59,130,246,.7),transparent);
      box-shadow:0 0 14px rgba(103,232,249,.55);
    }
    .hero::after {
      content:""; position:absolute; inset:auto -110px -190px auto; width:400px; height:400px;
      border-radius:50%; pointer-events:none;
      border:1px solid rgba(103,232,249,.28);
      box-shadow:0 0 0 42px rgba(37,99,235,.06), 0 0 0 96px rgba(6,182,212,.045), 0 0 90px rgba(6,182,212,.18) inset;
    }
    .hero-top { position:relative; z-index:1; display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap; }
    .hero h2 {
      margin:0; font-size:clamp(36px,5vw,60px); line-height:1.02; overflow-wrap:anywhere;
      font-weight:900; letter-spacing:-.015em;
      background:linear-gradient(180deg,#FFFFFF 22%,#A9C4F5 88%);
      -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent;
      filter:drop-shadow(0 6px 26px rgba(37,99,235,.35));
    }
    .hero p { margin:10px 0 0; color:rgba(214,226,248,.78); line-height:1.7; max-width:820px; }
    .controls { display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:flex-end; }
    /* ---------- controls ---------- */
    .btn, .seg button, select, input {
      min-height:38px; border:1px solid rgba(148,180,255,.18); border-radius:12px;
      background:rgba(5,9,20,.55); color:var(--text); padding:0 12px; transition:border-color .2s, box-shadow .2s, background .2s;
    }
    .hero .btn, .hero select, .hero input { color:#EDF2FC; }
    .btn:hover, select:hover { border-color:rgba(103,232,249,.42); }
    .btn.active {
      border-color:rgba(103,232,249,.5);
      background:linear-gradient(135deg,rgba(37,99,235,.75),rgba(6,182,212,.55));
      color:#fff;
      box-shadow:0 10px 28px rgba(6,182,212,.24), inset 0 1px 0 rgba(255,255,255,.25);
    }
    .btn.primary {
      background:var(--grad); border-color:transparent; color:#fff; font-weight:700;
      box-shadow:0 12px 32px rgba(37,99,235,.38), inset 0 1px 0 rgba(255,255,255,.28);
    }
    .btn.dev-action { min-height:32px; padding:0 10px; border-radius:9px; font-size:12px; }
    .prox { display:inline-block; margin-inline-start:6px; font-size:11px; font-weight:700; letter-spacing:.5px;
      padding:1px 7px; border-radius:8px; background:rgba(148,185,255,.10); white-space:nowrap; }
    .hs-wrap { display:flex; gap:14px; align-items:center; }
    .hs-score { flex:0 0 auto; width:84px; height:84px; border-radius:50%; border:4px solid; display:flex;
      flex-direction:column; align-items:center; justify-content:center; }
    .hs-score b { font-size:26px; font-weight:800; line-height:1; }
    .hs-score small { font-size:11px; opacity:.7; }
    .hs-reasons { flex:1 1 auto; display:flex; flex-direction:column; gap:5px; }
    .hs-reason { font-size:12.5px; padding:5px 9px; border-radius:8px; background:rgba(148,185,255,.08);
      padding-inline-start:9px; line-height:1.35; }
    .cli-tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:5px; }
    .cli-tags .prox { margin-inline-start:0; }
    .pro-cat { font-size:15px; font-weight:800; margin:18px 2px 8px; color:var(--text);
      padding-inline-start:10px; border-inline-start:3px solid var(--accent); }
    .pro-cat:first-of-type { margin-top:6px; }
    .seg { display:flex; gap:4px; padding:4px; border:1px solid rgba(148,180,255,.18); border-radius:14px; background:rgba(5,9,20,.5); }
    .seg button { min-height:30px; padding:0 10px; border-color:transparent; background:transparent; color:rgba(206,220,244,.72); }
    .seg button.active { background:linear-gradient(135deg,rgba(37,99,235,.85),rgba(6,182,212,.65)); color:#fff; box-shadow:0 4px 14px rgba(6,182,212,.28); }
    html[data-theme="light"] .btn, html[data-theme="light"] select, html[data-theme="light"] input { background:#FFFFFF; border-color:rgba(18,32,71,.16); color:var(--text); }
    html[data-theme="light"] .seg { background:#FFFFFF; border-color:rgba(18,32,71,.16); }
    html[data-theme="light"] .seg button { color:var(--muted); background:transparent; }
    html[data-theme="light"] .seg button.active { color:#fff; }
    /* light-theme .btn sets a white background; primary/active MUST also restore their
       gradient background here, otherwise it's white text on a white button (invisible). */
    html[data-theme="light"] .btn.primary { background:var(--grad); border-color:transparent; color:#fff; box-shadow:0 12px 32px rgba(37,99,235,.32), inset 0 1px 0 rgba(255,255,255,.28); }
    html[data-theme="light"] .btn.active { background:linear-gradient(135deg,rgba(37,99,235,.9),rgba(6,182,212,.7)); border-color:transparent; color:#fff; box-shadow:0 10px 28px rgba(6,182,212,.22); }
    /* hero keeps its royal-dark controls even in light theme */
    html[data-theme="light"] .hero .btn, html[data-theme="light"] .hero select { background:rgba(5,9,20,.55); border-color:rgba(148,180,255,.2); color:#EDF2FC; }
    html[data-theme="light"] .hero .seg { background:rgba(5,9,20,.5); border-color:rgba(148,180,255,.2); }
    html[data-theme="light"] .hero .seg button { color:rgba(206,220,244,.72); }
    html[data-theme="light"] .hero .btn.active, html[data-theme="light"] .hero .seg button.active { background:linear-gradient(135deg,rgba(37,99,235,.85),rgba(6,182,212,.65)); }
    html[data-theme="light"] .hero .btn.primary, .hero .btn.primary { background:var(--grad); border-color:transparent; color:#fff; box-shadow:0 12px 32px rgba(37,99,235,.38), inset 0 1px 0 rgba(255,255,255,.28); }
    .pulse { display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--excellent); box-shadow:0 0 0 0 rgba(16,185,129,.7); animation:pulse 1.8s infinite; }
    .pulse.bad { background:var(--weak); box-shadow:0 0 0 0 rgba(239,68,68,.65); }
    @keyframes pulse { 70%{box-shadow:0 0 0 12px transparent} 100%{box-shadow:0 0 0 0 transparent} }
    /* ---------- KPI: black glass tiles with luminous hairline ---------- */
    .kpi-grid { position:relative; z-index:1; display:grid; grid-template-columns:repeat(8,minmax(0,1fr)); gap:10px; }
    .kpi {
      min-width:0; position:relative; border:1px solid rgba(140,178,255,.15); border-radius:16px; padding:12px;
      background:linear-gradient(180deg,rgba(13,20,40,.72),rgba(4,7,16,.82));
      box-shadow:inset 0 1px 0 rgba(190,215,255,.12), 0 14px 34px rgba(0,0,0,.38);
    }
    .kpi::after { content:""; position:absolute; inset:0 22% auto; height:1px; background:linear-gradient(90deg,transparent,rgba(103,232,249,.5),transparent); }
    .kpi span { display:block; color:rgba(170,190,224,.72); font-size:11px; margin-bottom:6px; letter-spacing:.04em; }
    .kpi b { display:block; font-size:16px; overflow-wrap:anywhere; color:#F4F8FF; }
    .spark { width:100%; height:22px; margin-top:8px; }
    /* ---------- sections ---------- */
    .section { display:grid; gap:16px; }
    .section[hidden] { display:none; }
    .section-head { display:flex; align-items:flex-end; justify-content:space-between; gap:12px; }
    .section-head h3 { margin:0; font-size:22px; font-weight:800; letter-spacing:-.01em; }
    .section-head p { margin:4px 0 0; color:var(--muted); font-size:13px; }
    .grid { display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr)); }
    .grid.two { grid-template-columns:repeat(2,minmax(0,1fr)); }
    .grid.three { grid-template-columns:repeat(3,minmax(0,1fr)); }
    .grid.four { grid-template-columns:repeat(4,minmax(0,1fr)); }
    /* ---------- cards: floating obsidian layers ---------- */
    .card {
      min-width:0; position:relative; border:1px solid var(--border); border-radius:20px;
      background:linear-gradient(180deg,rgba(16,23,44,.88),rgba(7,11,23,.94));
      box-shadow:0 22px 64px rgba(0,0,0,.44), var(--sheen); padding:16px; overflow:hidden;
    }
    .card::before { content:""; position:absolute; inset:0 14% auto; height:1px; background:linear-gradient(90deg,transparent,rgba(93,169,255,.35),transparent); }
    html[data-theme="light"] .card { background:linear-gradient(180deg,#FFFFFF,#F7FAFE); }
    html[data-theme="light"] .card::before { background:linear-gradient(90deg,transparent,rgba(37,99,235,.25),transparent); }
    .card-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; }
    .title { display:flex; align-items:center; gap:8px; font-weight:800; min-width:0; letter-spacing:-.005em; }
    .title .ico { color:var(--accent); filter:drop-shadow(0 0 8px rgba(6,182,212,.5)); }
    .chip {
      display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--border);
      border-radius:999px; padding:5px 11px; color:var(--muted); font-size:12px;
      background:linear-gradient(180deg,rgba(22,31,58,.7),rgba(9,13,26,.7)); white-space:nowrap; box-shadow:var(--sheen);
    }
    html[data-theme="light"] .chip { background:#F1F5FB; }
    .ok { color:#34D399; border-color:rgba(16,185,129,.32); box-shadow:0 0 16px rgba(16,185,129,.10), var(--sheen); }
    .warn { color:#FBBF24; border-color:rgba(245,158,11,.34); box-shadow:0 0 16px rgba(245,158,11,.10), var(--sheen); }
    .bad { color:#F87171; border-color:rgba(239,68,68,.36); box-shadow:0 0 16px rgba(239,68,68,.10), var(--sheen); }
    html[data-theme="light"] .ok { color:#047857; } html[data-theme="light"] .warn { color:#92400E; } html[data-theme="light"] .bad { color:#B91C1C; }
    /* ---------- gauges ---------- */
    .gauge-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,172px),1fr)); gap:12px; }
    .gauge-card {
      border:1px solid rgba(140,178,255,.13); border-radius:18px;
      background:linear-gradient(180deg,rgba(15,22,42,.6),rgba(5,8,18,.7));
      padding:12px; min-height:238px; display:grid; gap:8px; align-content:start; box-shadow:var(--sheen);
    }
    html[data-theme="light"] .gauge-card { background:#F6F9FE; }
    .gauge { min-height:150px; display:grid; place-items:center; }
    .empty { color:var(--muted); border:1px dashed rgba(140,178,255,.2); border-radius:16px; padding:18px; background:rgba(12,18,36,.35); line-height:1.7; }
    html[data-theme="light"] .empty { background:#F3F7FD; }
    canvas {
      width:100%; height:220px; min-height:180px; display:block;
      border:1px solid rgba(132,168,255,.10); border-radius:16px;
      background:linear-gradient(180deg,rgba(6,10,22,.66),rgba(3,5,12,.78));
    }
    html[data-theme="light"] canvas { background:#F6F9FE; border-color:rgba(18,32,71,.10); }
    .mini { height:34px; min-height:34px; border:0; background:transparent; border-radius:0; }
    /* ---------- kv / traffic ---------- */
    .kv { display:grid; gap:8px; }
    .kv div { display:flex; align-items:center; justify-content:space-between; gap:12px; padding:9px 0; border-bottom:1px solid rgba(132,168,255,.09); }
    html[data-theme="light"] .kv div { border-bottom-color:rgba(18,32,71,.09); }
    .kv div:last-child { border-bottom:0; }
    .kv span { color:var(--muted); font-size:13px; }
    .kv b { text-align:end; overflow-wrap:anywhere; }
    .traffic-box {
      position:relative; border:1px solid rgba(140,178,255,.15); border-radius:18px; padding:14px;
      background:
        radial-gradient(240px 120px at 88% -30%, rgba(6,182,212,.16), transparent 62%),
        linear-gradient(180deg,rgba(12,19,38,.75),rgba(4,7,16,.85));
      min-width:0; box-shadow:inset 0 1px 0 rgba(190,215,255,.1), 0 14px 34px rgba(0,0,0,.32);
    }
    html[data-theme="light"] .traffic-box { background:radial-gradient(240px 120px at 88% -30%, rgba(6,182,212,.12), transparent 62%), #FFFFFF; }
    .traffic-box span, .traffic-box small { display:block; color:var(--muted); font-size:12px; letter-spacing:.05em; }
    .traffic-box b {
      display:block; margin:6px 0; font-size:26px; overflow-wrap:anywhere; font-weight:800; letter-spacing:-.02em;
      background:linear-gradient(180deg,#FFFFFF,#9DC1F2); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent;
    }
    html[data-theme="light"] .traffic-box b { background:linear-gradient(180deg,#0B1226,#2456B8); -webkit-background-clip:text; background-clip:text; }
    /* ---------- tables ---------- */
    .table-wrap { overflow:auto; border:1px solid var(--border); border-radius:18px; background:rgba(6,10,22,.4); box-shadow:var(--sheen); }
    html[data-theme="light"] .table-wrap { background:#FFFFFF; }
    table { width:100%; min-width:760px; border-collapse:collapse; }
    th, td { padding:12px 14px; border-bottom:1px solid rgba(132,168,255,.08); text-align:start; vertical-align:middle; font-size:13px; }
    html[data-theme="light"] th, html[data-theme="light"] td { border-bottom-color:rgba(18,32,71,.08); }
    th { color:var(--muted); font-size:11px; letter-spacing:.09em; text-transform:uppercase; font-weight:700; }
    thead tr { background:rgba(14,21,42,.55); }
    html[data-theme="light"] thead tr { background:#F3F7FD; }
    tbody tr:hover td { background:rgba(59,130,246,.05); }
    tr:last-child td { border-bottom:0; }
    .bar { height:9px; min-width:90px; background:rgba(88,112,160,.16); border:1px solid rgba(132,168,255,.10); border-radius:999px; overflow:hidden; box-shadow:inset 0 1px 2px rgba(0,0,0,.4); }
    html[data-theme="light"] .bar { background:rgba(18,32,71,.12); box-shadow:none; }
    .bar i { display:block; height:100%; width:0; background:var(--grad); border-radius:inherit; transition:width .35s; box-shadow:0 0 10px rgba(6,182,212,.45); }
    /* ---------- events / actions ---------- */
    .events { display:grid; gap:8px; max-height:360px; overflow:auto; }
    .events::-webkit-scrollbar, .table-wrap::-webkit-scrollbar, .ctl-pre::-webkit-scrollbar { width:8px; height:8px; }
    .events::-webkit-scrollbar-thumb, .table-wrap::-webkit-scrollbar-thumb, .ctl-pre::-webkit-scrollbar-thumb { background:rgba(96,130,190,.35); border-radius:99px; }
    .event {
      border:1px solid rgba(132,168,255,.1); border-radius:14px; padding:10px 12px;
      background:linear-gradient(180deg,rgba(17,25,48,.5),rgba(8,12,24,.5));
      color:var(--muted); font-size:13px;
      border-inline-start:2px solid rgba(6,182,212,.45);
    }
    html[data-theme="light"] .event { background:#F6F9FE; }
    .actions { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr)); gap:12px; }
    .action {
      text-align:start; min-height:96px; border:1px solid rgba(140,178,255,.14); border-radius:18px; padding:14px;
      background:linear-gradient(180deg,rgba(16,24,46,.72),rgba(6,10,21,.82));
      box-shadow:var(--sheen); transition:border-color .2s, box-shadow .2s, transform .2s;
    }

    /* ---------- branch layout ---------- */

    .branch-menu {

    }
    .branch-menu button:hover { color:var(--text); background:rgba(96,140,255,.07); }
    .branch-menu button.active {

      background:linear-gradient(135deg,rgba(37,99,235,.26),rgba(6,182,212,.10));

    }
    .branch-menu button.protected { border-color:rgba(245,158,11,.22); }

    .branch-detail {
      position:relative; border:1px solid var(--border); border-radius:20px; padding:18px;
      background:linear-gradient(180deg,rgba(16,23,44,.88),rgba(7,11,23,.94));

    html[data-theme="light"] .branch-detail { background:linear-gradient(180deg,#FFFFFF,#F7FAFE); }
    .branch-detail h3 { margin:0; font-size:30px; font-weight:900; letter-spacing:-.015em; }
    .branch-detail p { margin:0; color:var(--muted); line-height:1.8; }
    .branch-actions { display:flex; flex-wrap:wrap; gap:10px; }
    /* ---------- control cards / forms ---------- */
    .ctl-cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr)); gap:10px; }
    .ctl-card {

    .ctl-card.warn { border-color:rgba(245,158,11,.32); box-shadow:0 0 22px rgba(245,158,11,.09), var(--sheen); }
    .ctl-card.bad { border-color:rgba(239,68,68,.32); box-shadow:0 0 22px rgba(239,68,68,.09), var(--sheen); }
    .ctl-form { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr)); gap:12px; }
    .ctl-form label { display:grid; gap:8px; color:var(--muted); font-size:12px; }
    .ctl-subhead { margin:18px 0 4px; padding:9px 13px; font-size:14px; font-weight:800; color:var(--text);
      border-inline-start:3px solid var(--edge); border-radius:10px;

    .ctl-subhead:first-child { margin-top:2px; }
    .ctl-input, .ctl-form input, .ctl-form select, .wizard-fields select, .wizard-fields input {
      width:100%; min-width:0; min-height:42px; border:1px solid rgba(132,168,255,.16); border-radius:13px;
      background:rgba(4,8,18,.6); color:var(--text); padding:0 12px; outline:none;
    }
    .royal-field { min-width:0; }
    .ctl-input:focus, .ctl-form input:focus, .ctl-form select:focus, .wizard-fields select:focus, .wizard-fields input:focus { border-color:rgba(56,189,248,.6); box-shadow:0 0 0 3px rgba(37,99,235,.16), 0 0 18px rgba(6,182,212,.12); }
    .ctl-line { display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
    .ctl-line .ctl-input { flex:1 1 220px; }
    .ctl-pre {
      margin:0; max-height:420px; overflow:auto; direction:ltr; unicode-bidi:isolate;
      white-space:pre-wrap; word-break:break-word; border:1px solid rgba(132,168,255,.12);
      border-radius:16px; padding:14px; background:rgba(2,4,10,.72); color:#C9DAF3;

    html[data-theme="light"] .ctl-card, html[data-theme="light"] .ctl-input, html[data-theme="light"] .ctl-form input, html[data-theme="light"] .ctl-form select, html[data-theme="light"] .wizard-fields select, html[data-theme="light"] .wizard-fields input { background:#F6F9FE; border-color:rgba(18,32,71,.14); }
    html[data-theme="light"] .ctl-pre { background:#0B1226; color:#DCE7F7; }
    .ctl-status { color:var(--muted); border:1px dashed rgba(140,178,255,.22); border-radius:16px; padding:14px; line-height:1.7; }
    .ctl-note { color:var(--text); border:1px solid var(--border); border-inline-start:3px solid var(--edge);
      border-radius:14px; padding:13px 16px; line-height:1.85; white-space:pre-line; font-size:13.5px;

    html[data-theme="light"] .ctl-note { background:#F5F8FE; }
    /* ---------- wizard / royal panes ---------- */
    .wizard-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .wizard-tabs { display:flex; gap:10px; flex-wrap:wrap; margin:0 0 14px; }
    .wizard-tab {

      transition:.25s; box-shadow:var(--sheen); font-weight:600;
    }

    html[data-theme="light"] .wizard-tab { background:#FFFFFF; }

    .royal-pane[hidden] { display:none; }
    .royal-pane {

      background:linear-gradient(180deg,rgba(17,25,48,.6),rgba(6,10,21,.5));

    }
    html[data-theme="light"] .royal-pane { background:#F6F9FE; }
    .royal-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr)); gap:12px; }
    .royal-field[hidden] { display:none; }
    .mode-hint {
      margin:0 0 12px; border:1px solid rgba(6,182,212,.26); border-radius:16px; padding:12px 14px;
      color:var(--muted); background:linear-gradient(135deg,rgba(37,99,235,.12),rgba(6,182,212,.06));
      border-inline-start:2px solid rgba(6,182,212,.55);
    }
    .wizard-step {
      border:1px solid rgba(140,178,255,.14); border-radius:18px; padding:14px;
      background:linear-gradient(180deg,rgba(17,25,48,.62),rgba(6,10,21,.55));
      box-shadow:0 16px 40px rgba(0,0,0,.26), var(--sheen);
    }
    .wizard-step h4 { margin:0 0 10px; font-size:15px; color:var(--text); display:flex; gap:8px; align-items:center; }
    .wizard-step h4 i {
      width:26px; height:26px; border-radius:999px; display:inline-grid; place-items:center;
      background:var(--grad); color:#fff; font-style:normal; font-size:12px;
      box-shadow:0 0 14px rgba(6,182,212,.4);
    }
    .wizard-fields { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr)); gap:10px; }
    .wizard-preview {
      border:1px solid rgba(103,232,249,.28); border-radius:18px; padding:14px;

    .qr-box {
      width:112px; height:112px; border-radius:18px; padding:10px; background:#fff;

      box-shadow:0 0 0 1px rgba(255,255,255,.2), 0 10px 30px rgba(0,0,0,.4);

    html[data-theme="light"] .wizard-step { background:#F6F9FE; }
    /* ---------- toast ---------- */
    .toast {

      border:1px solid rgba(103,232,249,.4); border-radius:16px;
      background:linear-gradient(180deg,rgba(13,20,38,.97),rgba(5,8,18,.98)); color:#EDF2FC;

    .toast.show { opacity:1; transform:translateY(0); }
    .latin { direction:ltr; unicode-bidi:isolate; display:inline-block; }
    .muted { color:var(--muted); }
    /* ================= LOGIN: majestic obsidian gate ================= */
    .login-screen {
      --login-text:#F4F7FE; --login-muted:#A7B4CF; --login-border:rgba(140,178,255,.16);
      position:relative; min-height:100vh; display:grid; place-items:center; padding:20px; color:var(--login-text);
      background:
        radial-gradient(1050px 640px at 50% 10%, rgba(37,99,235,.30), transparent 62%),
        radial-gradient(560px 400px at 50% 26%, rgba(6,182,212,.18), transparent 60%),
        radial-gradient(720px 520px at 92% 90%, rgba(30,64,175,.14), transparent 64%),
        linear-gradient(180deg,#04050A 0%,#0A0F1E 56%,#05070F 100%);
    }
    .login-screen::before {
      content:""; position:fixed; inset:0; pointer-events:none; opacity:.75;
      background-image:radial-gradient(circle, rgba(150,186,255,.17) 1px, transparent 1.45px);
      background-size:27px 27px;
      -webkit-mask-image:radial-gradient(58% 52% at 50% 38%, #000 0%, transparent 100%);
      mask-image:radial-gradient(58% 52% at 50% 38%, #000 0%, transparent 100%);
    }
    .login-screen::after {
      content:""; position:fixed; left:50%; top:34%; width:min(880px,120vw); height:min(880px,120vw);
      transform:translate(-50%,-50%); pointer-events:none; border-radius:50%;
      background:radial-gradient(closest-side, rgba(103,232,249,.18), rgba(37,99,235,.11) 42%, transparent 70%);
      box-shadow:0 0 0 1px rgba(103,232,249,.05);
      animation:halo 9s ease-in-out infinite;
    }
    @keyframes halo { 0%,100%{opacity:.8} 50%{opacity:1} }
    .login-screen[hidden], .app[hidden] { display:none; }
    .login-card {
      position:relative; z-index:1; width:min(100%,450px); border:1px solid var(--login-border); border-radius:26px;
      background:linear-gradient(180deg,rgba(15,22,42,.92),rgba(4,7,15,.96));
      box-shadow:0 40px 120px rgba(0,0,0,.66), 0 0 90px rgba(37,99,235,.20), inset 0 1px 0 rgba(190,218,255,.12);
      padding:28px 26px; backdrop-filter:blur(20px);
    }
    .login-card::before {
      content:""; position:absolute; inset:0; border-radius:inherit; padding:1px; pointer-events:none;
      background:linear-gradient(165deg, rgba(125,211,252,.6), rgba(59,130,246,.16) 28%, rgba(4,7,15,0) 52%, rgba(37,99,235,.3) 82%, rgba(103,232,249,.5));
      -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite:xor; mask-composite:exclude;
    }
    html[data-theme="light"] .login-card { background:linear-gradient(180deg,rgba(15,22,42,.92),rgba(4,7,15,.96)); }
    .login-logo { display:flex; align-items:center; gap:14px; margin-bottom:20px; }
    .login-logo .mark { width:56px; height:56px; border-radius:18px; box-shadow:0 0 34px rgba(6,182,212,.5), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -10px 18px rgba(2,6,18,.35); }
    .login-card h1 {
      margin:0; font-size:32px; font-weight:900; letter-spacing:-.015em;
      background:linear-gradient(180deg,#FFFFFF 25%,#A9C4F5 90%);
      -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent;
    }
    .login-card p { margin:6px 0 0; color:var(--login-muted); line-height:1.7; }
    .login-form { display:grid; gap:12px; margin-top:22px; }
    .login-form label { display:grid; gap:8px; color:var(--login-muted); font-size:13px; }
    .login-form input {
      width:100%; min-height:48px; border:1px solid var(--login-border); background:rgba(4,8,18,.72);
      border-radius:14px; color:var(--login-text); padding-inline:14px; transition:border-color .2s, box-shadow .2s;
    }
    .login-form input:focus { outline:none; border-color:rgba(56,189,248,.6); box-shadow:0 0 0 3px rgba(37,99,235,.18), 0 0 24px rgba(6,182,212,.14); }
    html[data-theme="light"] .login-form input { background:rgba(4,8,18,.72); border-color:var(--login-border); color:var(--login-text); }
    .login-form button { min-height:50px; border-radius:14px; font-size:16px; letter-spacing:.02em; }
    /* login button: force gradient + white text in EVERY theme/state (never white-on-white) */
    #loginBtn, html[data-theme="light"] #loginBtn {
      background:linear-gradient(135deg,#2563EB,#06B6D4) !important; color:#FFFFFF !important;
      border:0 !important; font-weight:800 !important;

    }

    .login-msg { min-height:22px; color:var(--login-muted); line-height:1.6; font-size:13px; }
    .login-msg.bad { color:#F87171; border:0; box-shadow:none; }
    .login-warning {
      margin-top:14px; border:1px solid rgba(245,158,11,.26); border-radius:14px;
      background:linear-gradient(135deg,rgba(245,158,11,.10),rgba(245,158,11,.04)); color:#FCD98B; padding:12px 14px;
      font-size:13px; line-height:1.7; border-inline-start:2px solid rgba(245,158,11,.6);
    }
    html[data-theme="light"] .login-warning { color:#FCD98B; background:linear-gradient(135deg,rgba(245,158,11,.10),rgba(245,158,11,.04)); border-color:rgba(245,158,11,.26); }
    .login-meta { display:flex; justify-content:space-between; gap:10px; margin-top:16px; color:#8B98B8; font-size:12px; letter-spacing:.08em; }
    /* ================= responsive ================= */
    @media(max-width:1180px){ .kpi-grid,.grid.four{grid-template-columns:repeat(2,minmax(0,1fr))} .grid.three{grid-template-columns:repeat(2,minmax(0,1fr))} }
    @media(max-width:820px){
      .app{display:block; padding:10px 10px 88px}

      .hero{min-height:0; padding:16px; border-radius:20px}

      body[data-active-section]:not([data-active-section="overview"]) .hero h2{font-size:28px}

    }
    @media(max-width:430px){ .gauge-grid{grid-template-columns:1fr 1fr} .gauge-card{min-height:214px; padding:10px} .btn{width:100%} .login-card{padding:22px 18px} }
    @media(prefers-reduced-motion:reduce){ *,*::before,*::after{animation-duration:.001ms!important; transition-duration:.001ms!important; scroll-behavior:auto!important} }
  </style>
</head>
<body>
  <div class="login-screen" id="loginScreen">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="login-logo">
        <div class="mark" id="loginMark"></div>
        <div>
          <h1 id="loginTitle">Smart AP</h1>
          <p id="loginSubtitle">تسجيل الدخول إلى لوحة الراوتر</p>
        </div>
      </div>
      <form class="login-form" id="loginForm" autocomplete="off" autocapitalize="off" spellcheck="false">

          <input id="loginUser" name="smartap_user" autocomplete="off" inputmode="text" value="root" required>
        </label>
        <label for="loginPass"><span id="loginPassLabel">كلمة السر</span>
          <input id="loginPass" name="smartap_pass" type="password" autocomplete="new-password" value="admin" placeholder="كلمة المرور الافتراضية: admin">
        </label>

      <div class="login-meta"><span>CR6608</span><span>Offline · Local</span></div>
    </section>
  </div>

  <div class="app" id="appShell" hidden>
    <aside class="side">
      <div class="brand">
        <div class="mark" id="brandMark"></div>
        <div><h1>Smart AP</h1><p>Xiaomi CR6608</p></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="side-foot"><b id="sideTitle">Dashboard</b><br><span id="sideStatus">Loading data...</span></div>
    </aside>

    <main class="main">
      <header class="hero">
        <div class="hero-top">
          <div>
            <div class="chip ok"><span class="pulse" id="statusPulse"></span><span id="connectionState">Loading</span></div>
            <h2>Smart AP</h2>
            <p id="heroSubtitle">Local OpenWrt dashboard. Live data, offline assets, no CDN.</p>
          </div>
          <div class="controls">
            <div class="seg"><button id="langAr">AR</button><button id="langEn">EN</button></div>
            <button class="btn" id="themeBtn">Theme</button>
            <button class="btn" id="openWrtBtn">OpenWrt</button>
            <select id="intervalSelect" aria-label="Update interval">
              <option value="5">5s</option>
              <option value="10">10s</option>
              <option value="30">30s</option>
              <option value="60">60s</option>
              <option value="120">120s</option>
            </select>
            <button class="btn" id="logoutBtn">خروج</button>
            <button class="btn primary" id="refreshBtn">Refresh</button>
          </div>
        </div>
        <div class="kpi-grid" id="kpiBar"></div>
      </header>

      <section class="section" id="overview"></section>
      <section class="section" id="network" hidden></section>
      <section class="section" id="devices" hidden></section>
      <section class="section" id="wifi" hidden></section>
      <section class="section" id="insights" hidden></section>
      <section class="section" id="system" hidden></section>
      <section class="section" id="quick" hidden></section>
      <section class="section" id="isolation" hidden></section>
      <section class="section" id="netmgr" hidden></section>
      <section class="section" id="wifimgr" hidden></section>
      <section class="section" id="sysmgr" hidden></section>
      <section class="section" id="actions" hidden></section>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="/dashboard.js?v=20260706-final-v87" defer></script>
</body>
