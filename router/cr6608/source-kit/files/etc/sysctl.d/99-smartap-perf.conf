# Smart AP performance: headroom for many concurrent clients and fast forwarding.
# 11-nf-conntrack.conf owns conntrack sizing. A bridge AP does not need a
# 65536-entry table, which wastes scarce MT7621 memory.
net.core.netdev_max_backlog=4096
net.core.rmem_max=4194304
net.core.wmem_max=4194304
net.ipv4.tcp_fastopen=3
# br_netfilter is not shipped, so nonexistent bridge-nf keys are omitted.
# IPv6 is intentionally disabled for this IPv4-only product profile.
net.ipv6.conf.all.disable_ipv6=1
net.ipv6.conf.default.disable_ipv6=1
net.ipv6.conf.lo.disable_ipv6=1
# IPv4 management-plane hardening. These values do not alter bridge
# forwarding; they protect only locally terminated or routed packets.
kernel.kptr_restrict=2
kernel.dmesg_restrict=1
kernel.perf_event_paranoid=3
net.ipv4.tcp_syncookies=1
net.ipv4.conf.all.accept_redirects=0
net.ipv4.conf.default.accept_redirects=0
net.ipv4.conf.all.send_redirects=0
net.ipv4.conf.default.send_redirects=0
net.ipv4.conf.all.accept_source_route=0
net.ipv4.conf.default.accept_source_route=0
net.ipv4.conf.all.rp_filter=1
net.ipv4.conf.default.rp_filter=1
net.ipv4.conf.all.log_martians=1
net.ipv4.conf.default.log_martians=1
# --- Performance pack v79: faster packet path + bigger TCP pipes (no reboots, no power cuts) ---
net.core.netdev_budget=600
net.core.netdev_budget_usecs=8000
net.core.somaxconn=4096
net.core.optmem_max=65536
net.ipv4.tcp_rmem=4096 131072 4194304
net.ipv4.tcp_wmem=4096 131072 4194304
net.ipv4.tcp_mtu_probing=1
net.ipv4.tcp_slow_start_after_idle=0

# --- Performance pack v88 (verified fleet: RX/TX throughput + smoothness, MT7621) ---
net.core.dev_weight=128
net.core.rps_sock_flow_entries=32768
net.core.flow_limit_table_len=4096
net.ipv4.tcp_no_metrics_save=1
net.core.rmem_default=262144
net.core.wmem_default=262144
net.core.default_qdisc=fq_codel
