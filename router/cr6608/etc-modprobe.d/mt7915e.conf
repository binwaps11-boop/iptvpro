# CR6608 RF power lift — REAL, SAFE, PERMANENT (applied on every module load).
# The shipped mt7915e.ko is vendor-patched with a power override gated on the
# xiaomi,mi-router-cr6608 machine. Enabling it raises the driver's SKU power
# ceiling toward the linear cap (max 30 dBm; data-rate caps 26/24 dBm) instead of
# the stock conservative clamp. This is a driver runtime override — it does NOT
# write flash, cannot brick calibration, and is fully reversible (delete this file).
# The real emitted power is still bounded by the MT7915 hardware/PA; this simply
# removes the software SKU clamp so the radio runs at its true ceiling.
options mt7915e cr6608_rf_30dbm_test=1
