# KT412 light tuning for 128MB RAM + QCA9557.
# Conntrack sized for 128MB (default 16384 is fine; cap to avoid RAM blow-up).
net.netfilter.nf_conntrack_max=16384
net.netfilter.nf_conntrack_tcp_timeout_established=7440
net.netfilter.nf_conntrack_udp_timeout=60
net.netfilter.nf_conntrack_udp_timeout_stream=180

# fq_codel as default qdisc (low bufferbloat, light).
net.core.default_qdisc=fq_codel

# Sane router forwarding / memory.
net.ipv4.ip_forward=1
net.ipv4.tcp_fin_timeout=30
net.ipv4.tcp_keepalive_time=600

# Drop caches pressure friendliness on low RAM.
vm.min_free_kbytes=4096
vm.overcommit_memory=0

# Network buffers kept modest for 128MB.
net.core.rmem_max=1048576
net.core.wmem_max=1048576
