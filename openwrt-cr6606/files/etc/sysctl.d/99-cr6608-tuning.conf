# =============================================================================
# 99-cr6608-tuning.conf — CR6608 network-stack performance tuning
# -----------------------------------------------------------------------------
# Real, safe levers for a 256 MB mt7621 router (esp. IPTV + many clients). NO power
# or regulatory changes. fq_codel keeps latency low under load (smooth live streams);
# a larger conntrack table + longer UDP timeout suit many simultaneous devices/streams.
# Applied at boot by OpenWrt's sysctl service and re-applied first-boot by 48-cr6606-perf.
# =============================================================================

# Anti-bufferbloat: low-latency fair queuing as the default qdisc.
# (sch_fq_codel is built into the OpenWrt kernel — no extra package needed.)
net.core.default_qdisc=fq_codel

# Absorb short bursts instead of dropping them before the CPU drains the queue.
net.core.netdev_max_backlog=2048

# TCP niceties for the router's OWN connections (LuCI, opkg, updates).
net.ipv4.tcp_fastopen=3
net.ipv4.tcp_mtu_probing=1
net.ipv4.tcp_ecn=1

# Connection tracking: scale the table for many devices/streams, expire idle TCP
# sooner so the table doesn't fill on busy NAT networks, and keep long-lived UDP
# (IPTV/streaming) flows alive longer so they aren't torn down mid-stream.
net.netfilter.nf_conntrack_max=32768
net.netfilter.nf_conntrack_tcp_timeout_established=7200
net.netfilter.nf_conntrack_udp_timeout_stream=300
# UNREPLIED (one-directional) UDP timeout (default 30s). Only matters for a future
# ROUTED/NATed WAN->LAN multicast/VOD path (igmpproxy/udpxy); the shipped L2 IGMP-snooped
# + multicast_to_unicast path is bridged (no conntrack entry), so this is inert today —
# set for forward-compat/consistency only.
net.netfilter.nf_conntrack_udp_timeout=120

# softirq RX budget paired with a usecs ceiling (safe on 2-core mt7621): deeper bursts
# absorbed without one poll starving the other core / management.
net.core.netdev_budget=600
net.core.netdev_budget_usecs=4000
# modest default socket buffers (within 256MB) — no aggressive max inflation (fq_codel AQM)
net.core.rmem_default=262144
net.core.wmem_default=262144
